/* ============================================================
   REPLAY
   ============================================================ */
function replayAvailable(){ return rec.count>30; }
function endReplay(){
  replay.on=false;
  $('replaybar').classList.remove('on');
  for(let i=0;i<cars.length;i++){
    cars[i].mesh.visible=cars[i].demoT<=0;
    cars[i].disc.visible=cars[i].demoT<=0;
  }
}
function startReplay(sec){
  if(!replayAvailable()) return;
  const frames=Math.min(rec.count,Math.round(sec*REC_HZ));
  replay.on=true; replay.t=0; replay.dur=frames/REC_HZ;
  replay.frames=frames;
  replay.camA=Math.random()*Math.PI*2;
  replay.anchor.copy(ball.pos);
  $('replaybar').classList.add('on');
}
function stepReplay(dt){
  replay.t+=dt*0.65;
  const f=replay.t/replay.dur;
  if(f>=1){ endReplay(); return; }
  const idx=(rec.head-replay.frames+Math.floor(f*replay.frames)+REC_N*2)%REC_N;
  const fr=rec.frames[idx];
  ball.pos.copy(fr.ball);
  ballGroup.position.copy(fr.ball);
  for(let i=0;i<cars.length&&i<fr.cars.length;i++){
    cars[i].mesh.position.copy(fr.cars[i].p);
    cars[i].mesh.quaternion.copy(fr.cars[i].q);
    cars[i].mesh.visible=fr.cars[i].vis;
    cars[i].disc.visible=false;
  }
}

/* ============================================================
   GOAL
   ============================================================ */
function checkGoal(){
  if(Math.abs(ball.pos.x)>GHW-1||ball.pos.y>GH-1) return;
  if(Math.abs(ball.pos.z)<AZ+BR*0.9) return;
  const side=ball.pos.z>0?1:0;
  const scorer=1-side;
  state.score[scorer]++;
  let scorerCar=null;
  if(state.lastTouch===scorer){ scorerCar=nearestOf(scorer); if(scorerCar) scorerCar.goals++; }

  const own=(state.lastTouch>=0&&state.lastTouch!==scorer);
  const col=TEAM[scorer].col;
  burst(ball.pos.clone(),300,col,95,1.6,0.35);
  burst(ball.pos.clone(),140,0xffffff,64,1.1,0.35);
  shockwave(ball.pos.clone(),col,90,1.1);
  shockwave(ball.pos.clone(),0xffffff,55,0.8);
  state.shake=1.7; state.flash=0.85;
  SFX.goal(); MUSIC.stinger(scorer);
  const gc=$('goalCard');
  $('goalBig').textContent='TOR';
  $('goalBig').style.color=TEAM[scorer].hex;
  $('goalWho').textContent=TEAM[scorer].name+' TRIFFT'+(state.ot?' · GOLDEN GOAL':'');
  $('goalBonus').textContent=own?'EIGENTOR':(scorerCar&&scorerCar.vel.length()>SUPERSONIC?'ÜBERSCHALL-TREFFER':'');
  gc.classList.add('on');
  if(scorer===0&&!own&&Math.random()<0.6) quickChat(0,0);
  else if(scorer===1&&Math.random()<0.5) quickChat(1,3,nearestOf(1));

  ball.vel.set(0,0,0);
  state.phase='goal'; state.goalT=state.ot?1.7:5.1;
  if(!state.ot&&!REDUCED) startReplay(3.0);
  if(state.ot){ state._otEnd=true; setTimeout(endMatch,1700); }
}
function nearestOf(team){
  let best=null,bd=1e9;
  cars.forEach(function(c){
    if(c.team!==team) return;
    const d=c.pos.distanceTo(ball.pos);
    if(d<bd){bd=d;best=c;}
  });
  return best;
}

/* ============================================================
   POST-PROCESSING — bloom, speed blur, vignette, grain.
   Hand-rolled so nothing beyond the core library is needed.
   ============================================================ */
const POST=(function(){
  const quadScene=new T.Scene();
  const quadCam=new T.OrthographicCamera(-1,1,1,-1,0,1);
  const quadMesh=new T.Mesh(new T.PlaneGeometry(2,2),new T.MeshBasicMaterial());
  quadScene.add(quadMesh);

  const VS='varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }';
  const opt={minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,type:T.HalfFloatType,depthBuffer:true};
  let rtScene, rtA, rtB, ok=true;
  try{
    rtScene=(IS2&&T.WebGLMultisampleRenderTarget)? new T.WebGLMultisampleRenderTarget(2,2,opt)
                                                 : new T.WebGLRenderTarget(2,2,opt);
    if(rtScene.samples!==undefined) rtScene.samples=4;
    rtA=new T.WebGLRenderTarget(2,2,{minFilter:T.LinearFilter,magFilter:T.LinearFilter,format:T.RGBAFormat,type:T.HalfFloatType,depthBuffer:false});
    rtB=rtA.clone();
  }catch(e){ ok=false; }

  let level=2;
  const brightMat=new T.ShaderMaterial({
    uniforms:{tDiffuse:{value:null},uThresh:{value:0.62}},
    vertexShader:VS,
    fragmentShader:[
      'varying vec2 vUv; uniform sampler2D tDiffuse; uniform float uThresh;',
      'void main(){',
      '  vec3 c=texture2D(tDiffuse,vUv).rgb;',
      '  float l=dot(c,vec3(0.2126,0.7152,0.0722));',
      '  gl_FragColor=vec4(c*smoothstep(uThresh,uThresh+0.5,l),1.0);',
      '}'].join('\n')
  });
  const blurMat=new T.ShaderMaterial({
    uniforms:{tDiffuse:{value:null},uDir:{value:new T.Vector2(1,0)},uRes:{value:new T.Vector2(1,1)}},
    vertexShader:VS,
    fragmentShader:[
      'varying vec2 vUv; uniform sampler2D tDiffuse; uniform vec2 uDir; uniform vec2 uRes;',
      'void main(){',
      '  vec2 px=uDir/uRes;',
      '  vec3 s=texture2D(tDiffuse,vUv).rgb*0.2270270;',
      '  s+=texture2D(tDiffuse,vUv+px*1.3846153).rgb*0.3162162;',
      '  s+=texture2D(tDiffuse,vUv-px*1.3846153).rgb*0.3162162;',
      '  s+=texture2D(tDiffuse,vUv+px*3.2307692).rgb*0.0702702;',
      '  s+=texture2D(tDiffuse,vUv-px*3.2307692).rgb*0.0702702;',
      '  gl_FragColor=vec4(s,1.0);',
      '}'].join('\n')
  });
  const compMat=new T.ShaderMaterial({
    uniforms:{
      tDiffuse:{value:null}, tBloom:{value:null},
      uBloom:{value:0.85}, uSpeed:{value:0.0}, uFlash:{value:0.0},
      uTime:{value:0}, uAber:{value:0.0}
    },
    vertexShader:VS,
    fragmentShader:[
      'varying vec2 vUv;',
      'uniform sampler2D tDiffuse; uniform sampler2D tBloom;',
      'uniform float uBloom,uSpeed,uFlash,uTime,uAber;',
      'vec3 lin2srgb(vec3 c){ c=max(c,vec3(0.0));',
      '  return mix(c*12.92, 1.055*pow(c,vec3(0.4166667))-0.055, step(0.0031308,c)); }',
      'void main(){',
      '  vec2 uv=vUv;',
      '  vec2 dir=uv-vec2(0.5);',
      '  vec3 base=vec3(0.0);',
      '  if(uSpeed>0.001){',
      '    float w=0.0;',
      '    for(int i=0;i<4;i++){',
      '      float t=float(i)/3.0;',
      '      vec2 o=uv-dir*t*uSpeed*0.11;',
      '      float wi=1.0-t*0.6;',
      '      base+=texture2D(tDiffuse,o).rgb*wi; w+=wi;',
      '    }',
      '    base/=w;',
      '  } else { base=texture2D(tDiffuse,uv).rgb; }',
      '  float ab=uAber*0.0022+uSpeed*0.0016;',
      '  if(ab>0.0002){',
      '    base.r=texture2D(tDiffuse,uv+dir*ab).r;',
      '    base.b=texture2D(tDiffuse,uv-dir*ab).b;',
      '  }',
      '  vec3 bl=texture2D(tBloom,uv).rgb;',
      '  vec3 c=base+bl*uBloom;',
      '  c+=vec3(1.0,0.95,0.9)*uFlash;',
      '  float v=1.0-smoothstep(0.42,0.99,length(dir)*1.32);',
      '  c*=mix(0.62,1.0,v);',
      '  float g=fract(sin(dot(uv*vec2(1.0+uTime*0.0001,1.0),vec2(12.9898,78.233)))*43758.5453);',
      '  c+=(g-0.5)*0.020;',
      '  gl_FragColor=vec4(lin2srgb(c),1.0);',
      '}'].join('\n')
  });

  function blit(mat,target){
    quadMesh.material=mat;
    renderer.setRenderTarget(target||null);
    renderer.clear();
    renderer.render(quadScene,quadCam);
  }
  let lastW=2,lastH=2;
  function setSize(w,h){
    if(!ok) return;
    lastW=w; lastH=h;
    const pw=Math.max(2,Math.floor(w*DPR)), ph=Math.max(2,Math.floor(h*DPR));
    rtScene.setSize(pw,ph);
    const div=(level>=2)?2:3;
    const bw=Math.max(2,Math.floor(pw/div)), bh=Math.max(2,Math.floor(ph/div));
    rtA.setSize(bw,bh); rtB.setSize(bw,bh);
    blurMat.uniforms.uRes.value.set(bw,bh);
  }
  function setLevel(l){ level=l; setSize(lastW,lastH); }
  function render(speed,flash,aber,t){
    if(!ok){
      renderer.setRenderTarget(null);
      renderer.render(scene,camera);
      return;
    }
    renderer.setRenderTarget(rtScene);
    renderer.clear();
    renderer.render(scene,camera);

    if(level>0){
      brightMat.uniforms.tDiffuse.value=rtScene.texture;
      blit(brightMat,rtA);
      for(let i=0;i<level;i++){
        blurMat.uniforms.tDiffuse.value=rtA.texture;
        blurMat.uniforms.uDir.value.set(1.6,0); blit(blurMat,rtB);
        blurMat.uniforms.tDiffuse.value=rtB.texture;
        blurMat.uniforms.uDir.value.set(0,1.6); blit(blurMat,rtA);
      }
    }
    compMat.uniforms.tDiffuse.value=rtScene.texture;
    compMat.uniforms.tBloom.value=rtA.texture;
    compMat.uniforms.uBloom.value=(level>0)?0.85:0.0;
    compMat.uniforms.uSpeed.value=speed;
    compMat.uniforms.uFlash.value=flash;
    compMat.uniforms.uAber.value=aber;
    compMat.uniforms.uTime.value=t;
    blit(compMat,null);
  }
  return {setSize:setSize,setLevel:setLevel,render:render,get ok(){return ok;}};
})();
if(!POST.ok) renderer.outputEncoding=T.sRGBEncoding;

function applyQuality(){
  const q=QUAL[qi];
  DPR=Math.min(devicePixelRatio||1,q.dpr);
  partBudget=q.parts;
  renderer.setPixelRatio(DPR);
  renderer.shadowMap.enabled=q.shadow>0;
  if(q.shadow>0){
    if(key.shadow.map&&key.shadow.mapSize.x!==q.shadow){ key.shadow.map.dispose(); key.shadow.map=null; }
    key.shadow.mapSize.set(q.shadow,q.shadow);
  }
  key.castShadow=q.shadow>0;
  scene.traverse(function(o){
    if(!o.material) return;
    if(Array.isArray(o.material)) o.material.forEach(function(m){m.needsUpdate=true;});
    else o.material.needsUpdate=true;
  });
  for(let i=0;i<PMAX;i++){ parts[i].life=0; pPos[i*3+1]=-9999; }
  pGeo.setDrawRange(0,Math.min(partBudget,PMAX));
  POST.setLevel(q.bloom);
  resize();
}
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  POST.setSize(w,h);
}
addEventListener('resize',resize);

/* ---- one-shot environment capture for reflections ---- */
function bakeEnv(){
  try{
    const cubeRT=new T.WebGLCubeRenderTarget(256,{format:T.RGBAFormat,generateMipmaps:true,minFilter:T.LinearMipmapLinearFilter});
    const cubeCam=new T.CubeCamera(1,900,cubeRT);
    cubeCam.position.set(0,26,0);
    ballGroup.visible=false; pts.visible=false; trail.visible=false; jumbo.group.visible=false;
    cars.forEach(function(c){c.mesh.visible=false;c.disc.visible=false;});
    cubeCam.update(renderer,scene);
    ballGroup.visible=true; pts.visible=true; trail.visible=true; jumbo.group.visible=true;
    cars.forEach(function(c){c.mesh.visible=true;c.disc.visible=true;});
    const pmrem=new T.PMREMGenerator(renderer);
    pmrem.compileCubemapShader();
    scene.environment=pmrem.fromCubemap(cubeRT.texture).texture;
    pmrem.dispose();
    renderer.setRenderTarget(null);
  }catch(e){ /* reflections are a bonus, not a requirement */ }
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const FIXED=1/100;
let acc=0, last=performance.now(), predTick=false;
let frameAvg=16.7, qCheck=0;
document.addEventListener('visibilitychange',function(){
  if(document.hidden&&['menu','over','paused'].indexOf(state.phase)<0) togglePause();
});

function neutralInput(){ return {throttle:0,steer:0,jump:false,jumpEdge:false,boost:false,drift:false}; }

/* Inputs are sampled once per rendered frame, not once per physics substep:
   the gamepad and the AI only ever change that often anyway. */
let frameInputs=[];
function gatherInputs(dt){
  frameInputs.length=0;
  const live=(state.phase==='play');
  if(!live) jumpHeldPrev=false;
  for(let i=0;i<cars.length;i++){
    const c=cars[i];
    let inp;
    if(c===player) inp=live?playerInput(dt):neutralInput();
    else if(live||state.phase==='kickoff'){
      inp=aiInput(c,dt);
      if(!live){ inp.throttle=0; inp.boost=false; inp.jump=false; inp.jumpEdge=false; }
    } else inp=neutralInput();
    frameInputs.push(inp);
  }
}
function physics(dt){
  for(let i=0;i<cars.length;i++) cars[i].update(dt,frameInputs[i]||neutralInput());
  for(let i=0;i<cars.length;i++)
    for(let j=i+1;j<cars.length;j++){
      if(cars[i].demoT>0||cars[j].demoT>0) continue;
      carCar(cars[i],cars[j]);
    }

  if(state.phase==='play'||state.phase==='kickoff'){
    stepBall(dt);
    for(let i=0;i<cars.length;i++){
      if(cars[i].demoT>0) continue;
      if(cars[i].pos.distanceToSquared(ball.pos)<(BR+CAR_L)*(BR+CAR_L)) carBall(cars[i]);
    }
  }
  if(state.phase==='play') checkGoal();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000; last=now;
  if(dt>0.25) dt=0.25;
  uTime.value+=dt;

  const simulating=['paused','menu','over'].indexOf(state.phase)<0 && !replay.on;

  if(simulating){
    predTick=!predTick;
    if(predTick){ predictBall(); assignRoles(); }
    gatherInputs(dt);
    acc+=dt;
    let steps=0;
    while(acc>=FIXED&&steps<4){
      physics(FIXED); acc-=FIXED; steps++;
      for(let k=0;k<frameInputs.length;k++) frameInputs[k].jumpEdge=false;
    }
    if(steps>=4) acc=0;
    rec.t+=dt;
    if(rec.t>=1/REC_HZ){ rec.t=0; recordFrame(); }
  }

  if(replay.on) stepReplay(dt);

  /* phase timers */
  if(state.phase==='kickoff'){
    const prev=Math.ceil(state.kickT);
    state.kickT-=dt;
    const n=Math.ceil(state.kickT);
    if(n!==prev&&n>0) SFX.count(false);
    const el=$('count');
    if(state.kickT>0){ el.textContent=n>0?String(n):''; el.classList.remove('go'); }
    else {
      el.textContent='LOS'; el.classList.add('go');
      state.phase='play'; SFX.count(true); MUSIC.intensity(1);
      setTimeout(function(){ if($('count').textContent==='LOS') $('count').textContent=''; },520);
    }
  } else if(state.phase==='goal'){
    state.goalT-=dt;
    if(state.goalT<=0&&!state._otEnd){
      $('goalCard').classList.remove('on');
      if(!state.ot&&state.clock<=0&&state.score[0]!==state.score[1]&&!state.training) endMatch();
      else kickoff();
    }
  } else if(state.phase==='play'){
    state.kickT-=dt;   // lets the AI drop out of its kickoff rush
    if(state.training){ state.clock+=dt; }
    else if(!state.ot){
      state.clock-=dt;
      if(state.clock<=0){
        state.clock=0;
        if(ball.pos.y<BR+2.5){
          if(state.score[0]===state.score[1]){
            state.ot=true; toast('VERLÄNGERUNG · GOLDEN GOAL');
            state.phase='goal'; state.goalT=1.4;
          } else endMatch();
        }
      } else if(state.clock<25) MUSIC.intensity(2);
    } else state.clock+=dt;
  }

  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').classList.remove('on'); }
  if(state.flash>0) state.flash=Math.max(0,state.flash-dt*1.8);

  /* pads */
  for(let i=0;i<pads.length;i++){
    const p=pads[i];
    if(p.t>0){
      p.t-=dt;
      const on=p.t<=0;
      p.mesh.visible=on; p.halo.visible=on;
    } else {
      p.mesh.visible=true; p.halo.visible=true;
      const s=1+Math.sin(uTime.value*2.2+i)*0.07;
      p.mesh.scale.set(s,1,s);
      p.halo.material.opacity=0.10+0.06*Math.sin(uTime.value*1.7+i*1.3);
    }
  }

  /* ball visuals */
  const ballLive=(state.phase!=='goal')||replay.on;
  ballGroup.visible=ballLive; trail.visible=ballLive;
  if(!replay.on) ballGroup.position.copy(ball.pos);
  const bs=ball.vel.length();
  if(bs>0.5&&!replay.on){
    tmpV.copy(WUP).cross(ball.vel);
    if(tmpV.lengthSq()>1e-6){
      tmpV.normalize();
      ballMesh.rotateOnWorldAxis(tmpV,(bs/BR)*dt*0.55);
      ballCage.rotateOnWorldAxis(tmpV,(bs/BR)*dt*0.55);
    }
  }
  const heat=clamp((bs-38)/60,0,1);
  ballHalo.material.opacity=0.05+heat*0.32;
  ballHalo.scale.setScalar(1+heat*0.25);
  ballCage.material.opacity=0.18+heat*0.45;
  ballMesh.material.emissiveIntensity=0.7+heat*1.7;
  ballMesh.material.emissive.setHex(heat>0.55?0x66f0dd:0x1d3a5e);
  ballLight.position.copy(ballGroup.position);
  ballLight.intensity=0.35+heat*2.4;

  /* trail */
  trailHead=(trailHead-1+TRAIL)%TRAIL;
  trailHist[trailHead].copy(ballGroup.position);
  const dim=(state.phase==='menu')?0.2:1;
  const tr=0.165+(0.400-0.165)*heat, tg=0.361+(0.941-0.361)*heat, tb=0.612+(0.867-0.612)*heat;
  for(let i=0;i<TRAIL;i++){
    const p=trailHist[(trailHead+i)%TRAIL], f=1-i/TRAIL;
    const k=f*f*(0.22+heat*0.95)*dim;
    trailPos[i*3]=p.x; trailPos[i*3+1]=p.y; trailPos[i*3+2]=p.z;
    trailCol[i*3]=tr*k; trailCol[i*3+1]=tg*k; trailCol[i*3+2]=tb*k;
  }
  trailGeo.attributes.position.needsUpdate=true;
  trailGeo.attributes.color.needsUpdate=true;

  if(!replay.on) for(let i=0;i<cars.length;i++) cars[i].render(dt);
  updateParticles(dt);
  updateRings(dt);
  updateCamera(dt);
  jumbo.group.rotation.y+=dt*0.12;

  /* boost light follows whoever is burning hardest near the camera */
  if(player){
    boostLight.position.copy(player.pos).addScaledVector(player.fwd,-3);
    boostLight.intensity=player.flameLevel*2.6;
  }

  if(player&&state.phase==='play') SFX.engine(player.vel.length(),1);
  else if(player) SFX.engine(0,0);

  if(player){
    key.position.set(player.pos.x+70,150,player.pos.z-40);
    key.target.position.copy(player.pos); key.target.updateMatrixWorld();
  }

  updateHUD(dt);

  // keep an eye on the frame budget and step the quality down if we blow it
  frameAvg+=(dt*1000-frameAvg)*0.06;
  qCheck+=dt;
  if(qCheck>3){
    qCheck=0;
    if(frameAvg>26&&qi>0&&state.phase==='play'){
      qi--; state.q=qi; applyQuality();
      toast('GRAFIK AUTOMATISCH: '+QUAL[qi].name);
    }
  }

  const spd=player?player.vel.length():0;
  const speedFx=REDUCED?0:clamp((spd-SUPERSONIC*0.72)/70,0,1);
  POST.render(speedFx, state.flash, speedFx*0.9+state.shake*0.5, uTime.value);
}

/* ---- boot ---- */
state.q=qi;
applyQuality();
applyMutator();
buildTeams();
ball.pos.set(0,BASE_BALL_R+26,0); ball.vel.set(14,0,9);
cars.forEach(function(c,i){
  const s=TEAM[c.team].sign;
  c.reset(new V3((i%3-1)*34,RIDE,s*82),c.team===0?0:Math.PI,33);
});
bakeEnv();
showMenu();
$('loading').classList.add('off');
requestAnimationFrame(function(t){last=t;requestAnimationFrame(frame);});
})();
</script>
</body>
</html>
