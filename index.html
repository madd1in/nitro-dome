<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Autoball in einer Neon-Kuppel: Boost, Flips, Wandfahren und Tore gegen KI-Gegner. Three.js mit eigener Physik, prozeduraler Musik und Bloom-Pipeline.">
<meta name="theme-color" content="#05060c">
<meta name="color-scheme" content="dark">
<meta property="og:title" content="Nitro Dome">
<meta property="og:description" content="Autoball in einer Neon-Kuppel: Boost, Flips, Wandfahren und Tore gegen KI-Gegner. Three.js mit eigener Physik, prozeduraler Musik und Bloom-Pipeline.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.92em%22 font-size=%2290%22>%F0%9F%9A%97</text></svg>">
<title>Nitro Dome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">

<style>
:root{
  --void:#05060c;
  --deep:#0a0f1c;
  --panel:#0e1526;
  --panel2:#141d33;
  --edge:#22304e;
  --chalk:#eaf0fb;
  --slate:#8695b3;
  --ion:#2ea8ff;
  --flare:#ff7a1a;
  --glow:#66f0dd;
  --warn:#ffd23f;
  --display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --body:"Barlow","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--void);color:var(--chalk);font-family:var(--body);overflow:hidden;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

#stage{position:fixed;inset:0;background:var(--void)}
#scene{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none}

.chamf{clip-path:polygon(15px 0,100% 0,100% calc(100% - 15px),calc(100% - 15px) 100%,0 100%,0 15px)}
.chamf-sm{clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}

/* ================= HUD ================= */
#hud{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s ease}
#hud.on{opacity:1}

.score{position:absolute;top:16px;left:50%;transform:translateX(-50%);
  display:flex;align-items:stretch;background:rgba(10,15,28,.82);border:1px solid var(--edge);
  backdrop-filter:blur(10px);font-family:var(--display);font-variant-numeric:tabular-nums}
.score .side{display:flex;align-items:center;gap:10px;padding:9px 18px}
.score .tag{font-size:11px;letter-spacing:.16em;color:var(--slate);font-weight:600}
.score .n{font-size:34px;line-height:1;font-weight:700}
.score .o .n{color:var(--flare)} .score .b .n{color:var(--ion)}
.score .bar{width:4px} .score .o .bar{background:var(--flare)} .score .b .bar{background:var(--ion)}
.score .clock{padding:9px 22px;border-left:1px solid var(--edge);border-right:1px solid var(--edge);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:118px}
.score .clock .t{font-size:28px;font-weight:700;line-height:1;letter-spacing:.02em}
.score .clock .lbl{font-size:9px;letter-spacing:.22em;color:var(--slate);font-weight:600}
.score .clock.ot .t{color:var(--warn)}
.score .clock.low .t{color:var(--flare)}

.meta{position:absolute;top:16px;left:16px;display:flex;gap:6px;flex-wrap:wrap;max-width:230px}
.pill{background:rgba(10,15,28,.78);border:1px solid var(--edge);padding:5px 11px;
  font-family:var(--display);font-size:10px;letter-spacing:.14em;font-weight:600;color:var(--slate)}
.pill b{color:var(--chalk);font-weight:600}
.pill.mut{color:var(--warn);border-color:#4a3d18}

.boost{position:absolute;right:22px;bottom:22px;width:132px;height:132px}
.boost svg{width:100%;height:100%;transform:rotate(135deg)}
.boost .track{fill:none;stroke:rgba(134,149,179,.16);stroke-width:9}
.boost .fill{fill:none;stroke:var(--glow);stroke-width:9;stroke-linecap:butt;
  filter:drop-shadow(0 0 7px rgba(102,240,221,.55));transition:stroke .2s}
.boost.hot .fill{stroke:var(--flare);filter:drop-shadow(0 0 9px rgba(255,122,26,.6))}
.boost.inf .fill{stroke:var(--warn);filter:drop-shadow(0 0 9px rgba(255,210,63,.6))}
.boost .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.boost .val b{font-family:var(--display);font-size:37px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.boost .val span{font-family:var(--display);font-size:9px;letter-spacing:.24em;color:var(--slate);font-weight:600;margin-top:3px}

.speedo{position:absolute;left:22px;bottom:22px;background:rgba(10,15,28,.78);border:1px solid var(--edge);
  padding:11px 16px 10px;min-width:132px}
.speedo .v{font-family:var(--display);font-size:31px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.speedo .u{font-family:var(--display);font-size:9px;letter-spacing:.22em;color:var(--slate);font-weight:600;margin-top:3px}
.speedo .ss{margin-top:8px;height:3px;background:rgba(134,149,179,.16);overflow:hidden}
.speedo .ss i{display:block;height:100%;width:0%;background:var(--glow);transition:width .1s linear}
.speedo.sonic .v{color:var(--glow)}
.speedo.sonic .ss i{background:var(--flare)}

.centre{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);text-align:center;
  font-family:var(--display);pointer-events:none;width:min(92vw,720px)}
.count{font-size:112px;font-weight:700;line-height:1;letter-spacing:-.02em;
  text-shadow:0 0 34px rgba(102,240,221,.5)}
.count.go{color:var(--glow)}
.goalcard{display:none;flex-direction:column;align-items:center;gap:6px}
.goalcard.on{display:flex;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.goalcard .big{font-size:104px;font-weight:700;line-height:.88;letter-spacing:.02em}
.goalcard .who{font-size:15px;letter-spacing:.3em;font-weight:600;color:var(--slate)}
.goalcard .bonus{font-size:12px;letter-spacing:.24em;font-weight:600;color:var(--warn)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

.replaybar{position:absolute;left:0;right:0;top:0;bottom:0;display:none;pointer-events:none}
.replaybar.on{display:block}
.replaybar::before,.replaybar::after{content:"";position:absolute;left:0;right:0;height:9vh;
  background:linear-gradient(var(--void),rgba(5,6,12,0));}
.replaybar::before{top:0}
.replaybar::after{bottom:0;transform:rotate(180deg)}
.replaytag{position:absolute;left:26px;top:calc(9vh + 14px);display:flex;align-items:center;gap:9px;
  font-family:var(--display);font-size:12px;letter-spacing:.28em;font-weight:600;color:var(--chalk)}
.replaytag i{width:9px;height:9px;background:var(--flare);border-radius:50%;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.15}}

.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);
  font-family:var(--display);font-size:12px;letter-spacing:.2em;font-weight:600;
  background:rgba(10,15,28,.85);border:1px solid var(--edge);padding:7px 15px;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}

#chat{position:absolute;left:22px;bottom:104px;display:flex;flex-direction:column-reverse;gap:5px;max-width:290px}
.chatline{font-family:var(--display);font-size:11.5px;letter-spacing:.08em;font-weight:600;
  background:rgba(10,15,28,.84);border-left:3px solid var(--edge);padding:5px 11px;
  animation:slidein .22s ease-out}
.chatline b{font-weight:700}
@keyframes slidein{from{transform:translateX(-14px);opacity:0}to{transform:none;opacity:1}}

/* ================= OVERLAY ================= */
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(5,6,12,.5),rgba(5,6,12,.93) 72%);
  backdrop-filter:blur(3px);padding:20px;overflow-y:auto}
#ov.off{display:none}

.card{width:min(700px,100%);background:rgba(14,21,38,.9);border:1px solid var(--edge);
  padding:30px 32px 28px;box-shadow:0 30px 90px rgba(0,0,0,.6)}

.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-size:clamp(38px,7vw,60px);font-weight:700;line-height:.9;
  letter-spacing:-.02em;text-wrap:balance}
.brand h1 em{font-style:normal;color:var(--flare)}
.brand .v{font-family:var(--display);font-size:10px;letter-spacing:.26em;color:var(--slate);font-weight:600}
.lede{margin-top:12px;color:var(--slate);font-size:15px;line-height:1.55;max-width:58ch}
.lede b{color:var(--chalk);font-weight:600}

.rule{height:1px;background:linear-gradient(90deg,var(--edge),transparent);margin:22px 0 20px}

.opts{display:flex;flex-direction:column;gap:15px}
.opt .lab{font-family:var(--display);font-size:10px;letter-spacing:.22em;color:var(--slate);
  font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{pointer-events:auto;font-family:var(--display);font-size:12px;letter-spacing:.1em;font-weight:600;
  color:var(--slate);background:rgba(20,29,51,.7);border:1px solid var(--edge);padding:9px 15px;cursor:pointer;
  transition:.16s;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.seg button:hover{color:var(--chalk);border-color:#33456d;background:rgba(28,40,68,.8)}
.seg button[aria-pressed="true"]{color:var(--void);background:var(--glow);border-color:var(--glow)}
.seg button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.seg button small{display:block;font-size:9px;letter-spacing:.06em;opacity:.72;font-weight:500;margin-top:1px}

.go{margin-top:24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{pointer-events:auto;font-family:var(--display);font-size:15px;letter-spacing:.14em;font-weight:700;
  padding:14px 30px;border:none;cursor:pointer;transition:.16s;
  clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.btn.primary{background:var(--flare);color:#14060a}
.btn.primary:hover{background:#ff9440;transform:translateY(-1px)}
.btn.ghost{background:rgba(20,29,51,.8);color:var(--chalk);border:1px solid var(--edge)}
.btn.ghost:hover{border-color:#3a4d78;background:rgba(30,43,72,.9)}
.btn:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

.keys{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
  background:var(--edge);border:1px solid var(--edge)}
.keys div{background:var(--panel);padding:10px 13px;display:flex;justify-content:space-between;
  align-items:center;gap:10px}
.keys dt{font-size:12.5px;color:var(--slate)}
.keys dd{font-family:var(--display);font-size:11px;letter-spacing:.06em;font-weight:600;
  background:rgba(102,240,221,.1);color:var(--glow);padding:3px 8px;white-space:nowrap}

.foot{margin-top:18px;font-size:12px;color:var(--slate);line-height:1.55}
.foot code{font-family:var(--display);color:var(--glow);font-size:11.5px}

.result{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;margin:8px 0 4px}
.result .t{text-align:center}
.result .t .nm{font-family:var(--display);font-size:11px;letter-spacing:.22em;font-weight:600;color:var(--slate)}
.result .t .sc{font-family:var(--display);font-size:66px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.result .o .sc{color:var(--flare)} .result .b .sc{color:var(--ion)}
.result .dash{color:var(--edge);font-family:var(--display);font-size:30px}
.stats{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
  background:var(--edge);border:1px solid var(--edge)}
.stats div{background:var(--panel);padding:12px 14px}
.stats .k{font-family:var(--display);font-size:9px;letter-spacing:.2em;color:var(--slate);font-weight:600}
.stats .v{font-family:var(--display);font-size:23px;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}

.verdict{font-family:var(--display);font-size:13px;letter-spacing:.24em;font-weight:600;margin-bottom:6px}
.verdict.win{color:var(--glow)} .verdict.lose{color:var(--slate)} .verdict.draw{color:var(--warn)}

#touch{position:absolute;inset:0;pointer-events:none;display:none}
#touch.on{display:block}
.tbtn{position:absolute;pointer-events:auto;font-family:var(--display);font-size:11px;letter-spacing:.12em;
  font-weight:700;color:var(--chalk);background:rgba(20,29,51,.62);border:1px solid var(--edge);
  display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.tbtn.hit{background:rgba(102,240,221,.28);border-color:var(--glow)}
#tLeft{left:16px;bottom:104px;width:74px;height:74px}
#tRight{left:100px;bottom:104px;width:74px;height:74px}
#tGas{right:16px;bottom:186px;width:82px;height:70px}
#tBrake{right:106px;bottom:186px;width:70px;height:70px}
#tJump{right:16px;bottom:108px;width:82px;height:70px}
#tBoost{right:106px;bottom:108px;width:70px;height:70px;background:rgba(255,122,26,.22);border-color:#5c3a1e}
#tBoost.hit{background:rgba(255,122,26,.5);border-color:var(--flare)}

.topright{position:absolute;top:16px;right:16px;display:flex;gap:6px;pointer-events:auto}
.iconbtn{width:38px;height:38px;background:rgba(10,15,28,.8);border:1px solid var(--edge);color:var(--slate);
  cursor:pointer;font-family:var(--display);font-size:12px;font-weight:700}
.iconbtn:hover{color:var(--chalk);border-color:#3a4d78}
.iconbtn.off{color:#4b5872}

#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:var(--void);font-family:var(--display);letter-spacing:.3em;font-size:12px;color:var(--slate);z-index:5}
#loading.off{display:none}

@media (max-width:680px){
  .card{padding:22px 20px}
  .boost{width:104px;height:104px;right:auto;left:50%;transform:translateX(-50%);bottom:14px}
  .boost .val b{font-size:29px}
  .speedo{left:14px;bottom:14px;min-width:104px;padding:8px 12px 8px}
  .speedo .v{font-size:24px}
  .goalcard .big{font-size:64px}
  .count{font-size:74px}
  .keys{grid-template-columns:1fr}
  #chat{bottom:200px;left:14px;max-width:200px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <div id="hud">
    <div class="meta">
      <div class="pill chamf-sm" id="pMode">1 <b>VS</b> 1</div>
      <div class="pill chamf-sm" id="pDiff">PROFI</div>
      <div class="pill chamf-sm mut" id="pMut" style="display:none">MUTATOR</div>
    </div>

    <div class="score chamf">
      <div class="side o"><span class="bar"></span><span class="tag">ORANGE</span><span class="n" id="sO">0</span></div>
      <div class="clock" id="clockBox"><span class="t" id="clock">05:00</span><span class="lbl" id="clockLbl">SPIELZEIT</span></div>
      <div class="side b"><span class="n" id="sB">0</span><span class="tag">BLAU</span><span class="bar"></span></div>
    </div>

    <div class="topright">
      <button id="musicBtn" class="iconbtn chamf-sm" title="Musik (N)">♪</button>
      <button id="fsBtn" class="iconbtn chamf-sm" title="Vollbild (F)">⛶</button>
      <button id="pauseBtn" class="iconbtn chamf-sm" title="Pause (Esc)">II</button>
    </div>

    <div class="speedo chamf" id="speedo">
      <div class="v" id="spd">0</div>
      <div class="u">EINHEITEN / S</div>
      <div class="ss"><i id="ssBar"></i></div>
    </div>

    <div class="boost" id="boostGauge">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="track" cx="60" cy="60" r="48" stroke-dasharray="226 302" />
        <circle class="fill" id="boostArc" cx="60" cy="60" r="48" stroke-dasharray="0 302" />
      </svg>
      <div class="val"><b id="boostNum">33</b><span>BOOST</span></div>
    </div>

    <div id="chat"></div>

    <div class="replaybar" id="replaybar">
      <div class="replaytag"><i></i><span>WIEDERHOLUNG</span></div>
    </div>

    <div class="centre">
      <div class="count" id="count"></div>
      <div class="goalcard" id="goalCard">
        <div class="big" id="goalBig">TOR</div>
        <div class="who" id="goalWho"></div>
        <div class="bonus" id="goalBonus"></div>
      </div>

    <div class="toast chamf-sm" id="toast"></div>
  </div>

  <div id="touch">
    <div class="tbtn" id="tLeft" data-k="left">◀</div>
    <div class="tbtn" id="tRight" data-k="right">▶</div>
    <div class="tbtn" id="tGas" data-k="gas">GAS</div>
    <div class="tbtn" id="tBrake" data-k="brake">BREMSE</div>
    <div class="tbtn" id="tJump" data-k="jump">SPRUNG</div>
    <div class="tbtn" id="tBoost" data-k="boost">BOOST</div>
  </div>

  <div id="ov"><div class="card chamf" id="card"></div></div>
  <div id="loading">ARENA WIRD HOCHGEFAHREN</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
if(!window.THREE){document.getElementById('loading').textContent='3D-BIBLIOTHEK NICHT ERREICHBAR';return;}
const T=THREE, V3=T.Vector3, clamp=T.MathUtils.clamp;
const $=function(id){return document.getElementById(id);};
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ============================================================
   ARENA GEOMETRY — one signed distance field drives physics,
   the same numbers drive the mesh, so what you see is what you hit.
   ============================================================ */
const AX=100, AZ=132, AY=62;
const FIL=15, CHAM=46;
const BX=AX-FIL, BZ=AZ-FIL, BY=AY/2-FIL, CY=AY/2;
const K=AX+AZ-CHAM, BK=K-FIL*Math.SQRT2, SQ=Math.SQRT1_2;
const GHW=30, GH=22, GZF=AZ-FIL-3, GZB=AZ+26;
const GZC=(GZF+GZB)/2, GDH=(GZB-GZF)/2, GR=1.5;

const BASE_BALL_R=4.6;
const CAR_L=6.4, CAR_W=3.7, CAR_H=1.95, RIDE=1.15;

function sdArena(x,y,z){
  const ax=Math.abs(x), az=Math.abs(z);
  let dxz=Math.max(ax-BX, az-BZ);
  dxz=Math.max(dxz,(ax+az-K)*SQ+FIL);
  const dy=Math.abs(y-CY)-BY;
  const mx=Math.max(dxz,0), my=Math.max(dy,0);
  return Math.min(Math.max(dxz,dy),0)+Math.sqrt(mx*mx+my*my)-FIL;
}
function sdGoal(x,y,z,s){
  const dx=Math.abs(x)-(GHW-GR);
  const dy=Math.abs(y-GH/2)-(GH/2-GR);
  const dz=Math.abs(z*s-GZC)-(GDH-GR);
  const mx=Math.max(dx,0), my=Math.max(dy,0), mz=Math.max(dz,0);
  return Math.min(Math.max(dx,Math.max(dy,dz)),0)+Math.sqrt(mx*mx+my*my+mz*mz)-GR;
}
function sdf(x,y,z){
  return Math.min(sdArena(x,y,z), Math.min(sdGoal(x,y,z,1), sdGoal(x,y,z,-1)));
}
function sdNormal(p,out){
  const e=0.35, x=p.x,y=p.y,z=p.z;
  out.set(sdf(x+e,y,z)-sdf(x-e,y,z), sdf(x,y+e,z)-sdf(x,y-e,z), sdf(x,y,z+e)-sdf(x,y,z-e));
  if(out.lengthSq()<1e-9) out.set(0,-1,0);
  return out.normalize();
}

/* ============================================================
   TUNING
   ============================================================ */
const GRAV0=46, MAXSPD=115, DRIVE_MAX=62, SUPERSONIC=88;
const BOOST_ACC=58, BOOST_DRAIN=33, TANK=100;
const JUMP_IMP=26, JUMP2_IMP=22, DODGE_IMP=40;
const BALL_BOUNCE=0.62, BALL_FRIC=0.36, BALL_DRAG=0.031, BALL_MAX=108;
const CAR_MASS=6, BALL_MASS=1;

let G=GRAV0, BR=BASE_BALL_R, INF_BOOST=false, SPD_MUL=1;

const TEAM=[
  {name:'ORANGE', col:0xff7a1a, hex:'#ff7a1a', sign:-1},
  {name:'BLAU',   col:0x2ea8ff, hex:'#2ea8ff', sign: 1}
];
const DIFF=[

const GLSL_UTIL=[
'varying vec3 vWP; varying float vCD; uniform float uTime;',
'float ln(float d,float w){ return 1.0-smoothstep(w,w*2.6+vCD*0.0018,abs(d)); }',
'float rect(vec2 q,vec2 b,float w){ vec2 d=abs(q)-b; float o=min(max(d.x,d.y),0.0)+length(max(d,0.0)); return ln(o,w); }',
'vec3 teamTint(float z){ return mix(vec3(1.0,0.46,0.09),vec3(0.16,0.64,1.0),smoothstep(-46.0,46.0,z)); }'
].join('\n');

function injectWorldPos(sh){
  sh.uniforms.uTime=uTime;

    .replace('#include <common>','#include <common>\nvarying vec3 vWP;\nvarying float vCD;')
    .replace('#include <begin_vertex>',
      '#include <begin_vertex>\nvec4 _wp=modelMatrix*vec4(transformed,1.0);\nvWP=_wp.xyz;\nvCD=length(cameraPosition-_wp.xyz);');
}

const FLOOR_GLSL=[
GLSL_UTIL,
'vec3 fieldGlow(vec3 p){',
'  float g=0.0;',
'  vec2 gr=abs(fract(p.xz/18.0+0.5)-0.5)*18.0;',
'  g+=(1.0-smoothstep(0.05,0.62,min(gr.x,gr.y)))*0.05;',
'  g+=ln(p.z,0.75)*1.05;',
'  g+=ln(length(p.xz)-30.0,0.75)*1.05;',
'  g+=ln(length(p.xz)-7.0,0.5)*0.6;',
'  g+=rect(vec2(p.x,abs(p.z)-96.0),vec2(52.0,21.0),0.75)*0.95;',
'  g+=rect(vec2(p.x,abs(p.z)-112.0),vec2(30.0,5.0),0.75)*0.7;',
'  float per=1.0-smoothstep(0.55,1.0,max(abs(p.x)/85.0,abs(p.z)/117.0));',
'  vec3 c=mix(vec3(0.40,0.94,0.87),teamTint(p.z),smoothstep(60.0,120.0,abs(p.z)));',
'  float pulse=0.88+0.12*sin(uTime*1.1+length(p.xz)*0.02);',
'  return c*g*1.7*pulse+teamTint(p.z)*(1.0-per)*0.10;',
'}',
'vec3 fieldAlbedo(vec3 p){',
'  float v=1.0-smoothstep(30.0,150.0,length(p.xz));',
'  return mix(vec3(0.022,0.030,0.052),vec3(0.040,0.056,0.092),v);',
'}'
].join('\n');

function floorMaterial(){

      .replace('#include <common>','#include <common>\n'+FLOOR_GLSL)
      .replace('#include <color_fragment>','#include <color_fragment>\n  diffuseColor.rgb*=fieldAlbedo(vWP);')
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n  totalEmissiveRadiance+=fieldGlow(vWP);');
  };

}

/* shell: walls + ceiling, LED ribbon boards, goal mouths carved per-fragment */
const WALL_GLSL=[
GLSL_UTIL,
'varying vec3 vWN;',
'vec3 shellGlow(vec3 p,vec3 n){',
'  float horiz=1.0-abs(n.y);',
'  float u=(abs(n.x)>abs(n.z))?p.z:p.x;',
'  float band=ln(fract(p.y/12.0)*12.0-6.0,0.42)*horiz*0.26;',
'  float rib=ln(fract(u/17.0)*17.0-8.5,0.5)*horiz*0.18;',
'  float base=exp(-max(p.y,0.0)*0.15)*0.44*horiz;',
// LED ribbon board: scrolling chevrons in the defending team's colour
'  float ledMask=smoothstep(24.0,25.4,p.y)*(1.0-smoothstep(30.6,32.0,p.y))*horiz;',
'  float chev=fract((u*0.055)+uTime*0.30+abs(p.y-28.0)*0.06);',
'  float led=smoothstep(0.44,0.50,chev)*(1.0-smoothstep(0.90,0.97,chev));',
// ceiling truss
'  float truss=(1.0-horiz)*smoothstep(52.0,62.0,p.y)*(ln(fract(p.x/26.0)*26.0-13.0,0.9)+ln(fract(p.z/26.0)*26.0-13.0,0.9))*0.20;',
'  vec3 c=mix(vec3(0.32,0.86,0.82),teamTint(p.z),smoothstep(52.0,118.0,abs(p.z)));',
'  vec3 outc=c*(band+rib+base)+vec3(0.26,0.52,0.9)*truss;',
'  outc+=teamTint(p.z)*ledMask*led*0.80;',
'  return outc;',
'}'
].join('\n');

function shellMaterial(){
  const m=new T.MeshStandardMaterial({color:0x070c16,roughness:0.42,metalness:0.55,side:T.BackSide,envMapIntensity:0.35});
  m.onBeforeCompile=function(sh){
    injectWorldPos(sh);
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vWN;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\n  vWN=normalize(mat3(modelMatrix)*objectNormal);');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>','#include <common>\n'+WALL_GLSL)
      .replace('#include <clipping_planes_fragment>',
        '#include <clipping_planes_fragment>\n  if(abs(vWP.x)<'+GHW.toFixed(1)+' && vWP.y<'+GH.toFixed(1)+' && abs(vWP.z)>'+(AZ-FIL-2).toFixed(1)+') discard;')
      .replace('#include <emissivemap_fragment>','#include <emissivemap_fragment>\n  totalEmissiveRadiance+=shellGlow(vWP,normalize(vWN));');
  };
  return m;
}

function octagonShape(sx,sz,k){
  const s=new T.Shape();
  const a=k-sx, b=k-sz;
  s.moveTo(sx,a); s.lineTo(b,sz); s.lineTo(-b,sz); s.lineTo(-sx,a);
  s.lineTo(-sx,-a); s.lineTo(-b,-sz); s.lineTo(b,-sz); s.lineTo(sx,-a);
  s.closePath(); return s;
}

function buildArena(){
  const g=staticGroup;

  const shape=octagonShape(BX,BZ,BK);
  const geo=new T.ExtrudeGeometry(shape,{depth:AY-2*FIL,bevelEnabled:true,bevelThickness:FIL,
    bevelSize:FIL,bevelOffset:0,bevelSegments:9,curveSegments:1});
  geo.rotateX(-Math.PI/2); geo.translate(0,FIL,0); geo.computeVertexNormals();
  g.add(new T.Mesh(geo,shellMaterial()));

  const fg=new T.ShapeGeometry(octagonShape(BX,BZ,BK));
  fg.rotateX(-Math.PI/2); fg.translate(0,0.03,0);
  const floor=new T.Mesh(fg,floorMaterial());
  floor.receiveShadow=true; g.add(floor);

  for(let s=0;s<2;s++){
    const sign=s===0?-1:1, tm=TEAM[s];
    const depth=GZB-GZF;
    const box=new T.Mesh(new T.BoxGeometry(GHW*2,GH,depth),
      new T.MeshStandardMaterial({color:0x050912,roughness:0.85,metalness:0.1,side:T.BackSide}));
    box.position.set(0,GH/2,sign*GZC); g.add(box);

    const netMat=new T.ShaderMaterial({
      transparent:true, depthWrite:false, side:T.DoubleSide,
      uniforms:{uCol:{value:new T.Color(tm.col)},uTime:uTime},
      vertexShader:'varying vec2 vU; void main(){ vU=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} ',
      fragmentShader:[
        'varying vec2 vU; uniform vec3 uCol; uniform float uTime;',
        'void main(){',
        '  vec2 q=abs(fract(vU*vec2(22.0,10.0))-0.5);',
        '  float m=1.0-smoothstep(0.03,0.12,min(q.x,q.y));',
        '  float glow=0.18+0.34*m+0.10*sin(uTime*1.6+vU.y*8.0);',
        '  gl_FragColor=vec4(uCol*glow*1.6,0.22+m*0.58);',
        '}'].join('\n')
    });
    const net=new T.Mesh(new T.PlaneGeometry(GHW*2-1,GH-1),netMat);
    net.position.set(0,GH/2,sign*(GZB-0.6)); net.rotation.y=sign>0?Math.PI:0; g.add(net);

    const fm=new T.MeshBasicMaterial({color:tm.col});
    const bar=function(w,h,d,x,y,z){
      const m=new T.Mesh(new T.BoxGeometry(w,h,d),fm); m.position.set(x,y,z); g.add(m);
      const halo=new T.Mesh(new T.BoxGeometry(w+1.8,h+1.8,d+1.8),
        new T.MeshBasicMaterial({color:tm.col,transparent:true,opacity:0.17,blending:T.AdditiveBlending,depthWrite:false}));
      halo.position.set(x,y,z); g.add(halo);
    };
    const zz=sign*(AZ-0.4);
    bar(GHW*2+3,1.5,1.5, 0, GH, zz);
    bar(1.5,GH+1.5,1.5,  GHW, GH/2, zz);
    bar(1.5,GH+1.5,1.5, -GHW, GH/2, zz);
    bar(GHW*2+3,0.9,1.5, 0, 0.45, zz);
  }

  const accent=new T.MeshBasicMaterial({color:0x66f0dd,transparent:true,opacity:0.45,blending:T.AdditiveBlending,depthWrite:false});
  for(let i=0;i<4;i++){
    const sx=(i&1)?1:-1, sz=(i&2)?1:-1;
    const p1=new V3(sx*BX,0,sz*(BK-BX)), p2=new V3(sx*(BK-BZ),0,sz*BZ);
    const c=p1.clone().add(p2).multiplyScalar(0.5);
    const strip=new T.Mesh(new T.BoxGeometry(p1.distanceTo(p2),1.0,0.9),accent);
    strip.position.set(c.x,1.2,c.z);
    strip.rotation.y=Math.atan2(p2.x-p1.x,p2.z-p1.z)+Math.PI/2;
    g.add(strip);
  }
}

function emit(p,v,color,life,spread,g){
  const q=parts[pHead]; pHead=(pHead+1)%Math.min(partBudget,PMAX);
  q.p.copy(p); q.v.copy(v);
  if(spread){q.v.x+=(Math.random()-0.5)*spread;q.v.y+=(Math.random()-0.5)*spread;q.v.z+=(Math.random()-0.5)*spread;}
  q.c.setHex(color); q.life=life; q.max=life; q.g=(g===undefined?1:g);
}
function burst(p,n,color,speed,life,g){
  for(let i=0;i<n;i++){
    const v=new V3(Math.random()-0.5,Math.random()-0.5,Math.random()-0.5).normalize()
      .multiplyScalar(speed*(0.35+Math.random()*0.65));
    emit(p,v,color,life*(0.5+Math.random()*0.7),0,g);
  }
}
function updateParticles(dt){
  for(let i=0;i<PMAX;i++){
    const q=parts[i];
    if(q.life>0){
      q.life-=dt;
      if(q.life<=0){pPos[i*3+1]=-9999;continue;}
      q.v.y-=G*0.42*q.g*dt;
      q.v.multiplyScalar(1-1.35*dt);
      q.p.addScaledVector(q.v,dt);
      if(q.p.y<0.2){q.p.y=0.2;q.v.y=Math.abs(q.v.y)*0.32;q.v.x*=0.7;q.v.z*=0.7;}
      const f=Math.min(1,q.life/q.max);
      pPos[i*3]=q.p.x;pPos[i*3+1]=q.p.y;pPos[i*3+2]=q.p.z;
      pCol[i*3]=q.c.r*f;pCol[i*3+1]=q.c.g*f;pCol[i*3+2]=q.c.b*f;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
}

const rings=[];
const ringGeo=new T.RingGeometry(1,1.14,64);
for(let i=0;i<6;i++){
  const m=new T.Mesh(ringGeo,new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0,
    blending:T.AdditiveBlending,depthWrite:false,side:T.DoubleSide}));
  m.visible=false; scene.add(m); rings.push({mesh:m,t:0,dur:1,max:60});
}
function shockwave(p,color,max,dur,normal){
  for(let i=0;i<rings.length;i++){
    const r=rings[i];
    if(r.t>0) continue;
    r.t=dur; r.dur=dur; r.max=max;
    r.mesh.visible=true; r.mesh.position.copy(p);
    r.mesh.material.color.setHex(color);
    if(normal) r.mesh.quaternion.setFromUnitVectors(new V3(0,0,1),normal);
    else r.mesh.rotation.set(-Math.PI/2,0,0);
    return;
  }
}
function updateRings(dt){
  for(let i=0;i<rings.length;i++){
    const r=rings[i];
    if(r.t<=0) continue;
    r.t-=dt;
    const f=1-r.t/r.dur;
    r.mesh.scale.setScalar(2+f*r.max);
    r.mesh.material.opacity=Math.max(0,(1-f)*(1-f)*0.85);
    if(r.t<=0) r.mesh.visible=false;
  }
}

  pads.push({x:x,z:z,big:big,t:0,mesh:m,halo:halo,r:big?9:6});
}

   CAR
   ============================================================ */
/* ── Cars ────────────────────────────────────────────────────────────────
   The body is one extruded side profile instead of a stack of boxes, and the
   paint scheme — livery, headlamps, tail lights, sill glow — is drawn in the
   shader from the model's own coordinates, so it costs no extra geometry.
   Every car of a team shares one set of geometry and materials.            */
function mergeGeos(list){
  let total=0;
  const gs=list.map(function(g){
    const n=g.index?g.toNonIndexed():g;
    total+=n.attributes.position.count;
    return n;
  });
  const pos=new Float32Array(total*3), nor=new Float32Array(total*3), uv=new Float32Array(total*2);
  let o=0;
  gs.forEach(function(g){
    pos.set(g.attributes.position.array,o*3);
    nor.set(g.attributes.normal.array,o*3);
    if(g.attributes.uv) uv.set(g.attributes.uv.array,o*2);
    o+=g.attributes.position.count;
  });
  const out=new T.BufferGeometry();
  out.setAttribute('position',new T.BufferAttribute(pos,3));
  out.setAttribute('normal',new T.BufferAttribute(nor,3));
  out.setAttribute('uv',new T.BufferAttribute(uv,2));
  return out;
}
function boxGeo(w,h,d,x,y,z,rx){
  const g=new T.BoxGeometry(w,h,d);
  if(rx) g.rotateX(rx);
  g.translate(x,y,z);
  return g;
}
function tubeGeo(r1,r2,len,x,y,z){
  const g=new T.CylinderGeometry(r1,r2,len,12);
  g.rotateX(Math.PI/2); g.translate(x,y,z);
  return g;
}
function profileGeo(pts,width,bev){
  const s=new T.Shape();
  s.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++) s.lineTo(pts[i][0],pts[i][1]);
  s.closePath();
  const d=Math.max(0.05,width-bev*2);
  const g=new T.ExtrudeGeometry(s,{depth:d,bevelEnabled:true,bevelThickness:bev,bevelSize:bev,
    bevelOffset:0,bevelSegments:3,curveSegments:1});
  g.translate(0,0,-d/2);
  g.rotateY(-Math.PI/2);      // profile now runs along the car's length, nose at -Z
  return g;
}

const CARGEO=(function(){
  // side view: low wedge nose, cab set back, kicked-up tail
  const shell=profileGeo([
    [-3.18,-0.60],[-3.30,-0.16],[-3.02, 0.14],[-2.05, 0.32],

    boxGeo(0.16,0.34,3.60, -CAR_W*0.52,-0.42,0.20),

    boxGeo(0.13,0.56,0.90,  CAR_W*0.50,1.14,2.74),               // endplates

  const glass=profileGeo([[-0.56,0.32],[-0.28,1.08],[0.64,1.12],[1.04,0.36]],CAR_W-1.30,0.06);

function rimTexture(hex){
  const c=document.createElement('canvas'); c.width=c.height=128;
  const g=c.getContext('2d');
  g.fillStyle='#0a0e16'; g.fillRect(0,0,128,128);
  g.translate(64,64);
  g.strokeStyle=hex; g.lineWidth=8;
  g.beginPath(); g.arc(0,0,55,0,Math.PI*2); g.stroke();
  g.strokeStyle='#1c2536'; g.lineWidth=3;
  g.beginPath(); g.arc(0,0,45,0,Math.PI*2); g.stroke();
  g.strokeStyle=hex; g.lineWidth=7; g.lineCap='round';
  for(let i=0;i<6;i++){
    g.rotate(Math.PI/3);
    g.beginPath(); g.moveTo(0,12); g.lineTo(0,44); g.stroke();
  }
  g.fillStyle='#ccd9ee'; g.beginPath(); g.arc(0,0,10,0,Math.PI*2); g.fill();
  const t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t;
}

function liveryMat(hex){
  const m=new T.MeshStandardMaterial({color:0xffffff,roughness:0.20,metalness:0.86,envMapIntensity:1.35});
  const col=new T.Color(hex);
  m.onBeforeCompile=function(sh){
    sh.uniforms.uTeam={value:col};
    sh.vertexShader=sh.vertexShader
      .replace('#include <common>','#include <common>\nvarying vec3 vLoc;')
      .replace('#include <begin_vertex>','#include <begin_vertex>\n  vLoc=position;');
    sh.fragmentShader=sh.fragmentShader
      .replace('#include <common>',['#include <common>',
        'varying vec3 vLoc; uniform vec3 uTeam;',
        'float liveryMask(vec3 p){',
        '  float nose=smoothstep(-1.7,-2.7,p.z);',
        '  float swoosh=smoothstep(0.46,0.10,abs(p.y+0.02+p.z*0.135))*step(-2.7,p.z)*step(p.z,2.3);',
        '  float wing=step(1.15,p.y)*step(2.3,p.z);',
        '  return clamp(max(max(nose,swoosh*0.95),wing),0.0,1.0);',
        '}',
        'float sillLine(vec3 p){ return smoothstep(0.09,0.0,abs(p.y+0.575))*step(-2.6,p.z)*step(p.z,2.6); }',
        'float headLamp(vec3 p){ return (1.0-step(-2.80,p.z))*smoothstep(0.22,0.02,abs(p.y+0.08))*smoothstep(1.45,0.70,abs(p.x)); }',
        'float tailLamp(vec3 p){ return step(2.95,p.z)*smoothstep(0.24,0.04,abs(p.y-0.05))*smoothstep(1.55,0.60,abs(p.x)); }'
        ].join('\n'))
      .replace('#include <color_fragment>',['#include <color_fragment>',
        '  float _lv=liveryMask(vLoc);',
        '  diffuseColor.rgb=mix(vec3(0.052,0.066,0.100),uTeam,_lv);'
        ].join('\n'))
      .replace('#include <emissivemap_fragment>',['#include <emissivemap_fragment>',
        '  totalEmissiveRadiance+=uTeam*(_lv*0.28+sillLine(vLoc)*1.6+tailLamp(vLoc)*2.0);',
        '  totalEmissiveRadiance+=vec3(0.82,0.91,1.0)*headLamp(vLoc)*2.4;'
        ].join('\n'));
  };
  return m;
}

const CARMAT=[0,1].map(function(t){
  const hex=TEAM[t].col, css=TEAM[t].hex;
  return {
    body:liveryMat(hex),
    glass:new T.MeshStandardMaterial({color:0x070d1a,roughness:0.03,metalness:1.0,envMapIntensity:1.8}),
    chrome:new T.MeshStandardMaterial({color:0xa8bcdc,roughness:0.14,metalness:1.0,envMapIntensity:1.6}),
    glow:new T.MeshBasicMaterial({color:hex}),
    tire:new T.MeshStandardMaterial({color:0x090c14,roughness:0.92,metalness:0.04}),
    rim:new T.MeshStandardMaterial({map:rimTexture(css),roughness:0.25,metalness:0.9,
      emissive:new T.Color(hex),emissiveIntensity:0.25,envMapIntensity:1.4}),
    flame:new T.MeshBasicMaterial({color:0xffb347,transparent:true,opacity:0,
      blending:T.AdditiveBlending,depthWrite:false}),
    disc:new T.MeshBasicMaterial({color:hex,transparent:true,opacity:0.2,
      blending:T.AdditiveBlending,depthWrite:false,map:SPRITE})
  };

function buildCarMesh(team){
  const M=CARMAT[team], g=new T.Group();
  const body=new T.Mesh(CARGEO.body,M.body);
  body.castShadow=true; g.add(body);
  g.add(new T.Mesh(CARGEO.glass,M.glass));
  g.add(new T.Mesh(CARGEO.chrome,M.chrome));
  g.add(new T.Mesh(CARGEO.glow,M.glow));

  const wheels=[], wmat=[M.tire,M.rim,M.rim];
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(function(o){
    const w=new T.Mesh(CARGEO.wheel,wmat);
    w.position.set(o[0]*(CAR_W*0.5+0.02),-0.27,o[1]*CAR_L*0.30);
    w.castShadow=true;
    g.add(w); wheels.push(w);
  });

  const flames=[];
  for(let s=-1;s<=1;s+=2){
    const f=new T.Mesh(CARGEO.flame,M.flame.clone());
    f.position.set(s*0.78,-0.14,3.30);
    g.add(f); flames.push(f);
  }

  const disc=new T.Mesh(new T.CircleGeometry(3.4,24),M.disc.clone());
  scene.add(disc);
  scene.add(g);
  return {group:g,wheels:wheels,flames:flames,disc:disc};
}

const WUP=new V3(0,1,0);
function Car(team,ai,idx){
  this.team=team; this.ai=ai; this.idx=idx;
  this.pos=new V3(); this.vel=new V3();
  this.quat=new T.Quaternion();
  this.angVel=new V3();
  this.up=new V3(0,1,0); this.fwd=new V3(0,0,1); this.right=new V3(1,0,0);
  this.grounded=false; this.groundLock=0; this.jumps=0; this.dodgeWin=0; this.dodgeT=0;
  this.boost=33; this.demoT=0; this.flameLevel=0;
  this.touches=0; this.boostUsed=0; this.goals=0; this.shots=0; this.saves=0; this.demos=0; this.topSpd=0;
  this.think=0; this.aim=new V3(); this.role='attack'; this.aerialT=0; this.sonic=0;
  this.wheelSpin=0; this.chatT=0;
  const v=buildCarMesh(team);
  this.mesh=v.group; this.wheels=v.wheels; this.flames=v.flames; this.disc=v.disc;
}
Car.prototype.setYaw=function(yaw){
  this.fwd.set(Math.sin(yaw),0,Math.cos(yaw));
  this.up.set(0,1,0);
  this.right.copy(this.fwd).cross(this.up);
  this.syncQuat();
};
Car.prototype.syncQuat=function(){
  _bk.copy(this.fwd).negate();
  _m4.makeBasis(this.right,this.up,_bk);
  this.quat.setFromRotationMatrix(_m4);
};
Car.prototype.readBasis=function(){
  this.fwd.set(0,0,-1).applyQuaternion(this.quat);
  this.up.set(0,1,0).applyQuaternion(this.quat);
  this.right.set(1,0,0).applyQuaternion(this.quat);
};
Car.prototype.reset=function(pos,yaw,boost){
  this.pos.copy(pos); this.vel.set(0,0,0); this.angVel.set(0,0,0);
  this.setYaw(yaw); this.grounded=true; this.groundLock=0; this.jumps=0;
  this.dodgeWin=0; this.dodgeT=0; this.demoT=0; this.aerialT=0;
  if(boost!==undefined) this.boost=boost;
};

const tmpN=new V3(), tmpV=new V3();
/* scratch vectors — the physics runs up to 4x per frame across 6 cars, so
   nothing in here is allowed to allocate */
const _m4=new T.Matrix4(), _bk=new V3(), _su=new V3(), _in2=new V3(), _f=new V3(), _zAxis=new V3(0,0,1);

Car.prototype.update=function(dt,inp){
  if(this.demoT>0){
    this.demoT-=dt;
    this.mesh.visible=false; this.disc.visible=false;
    if(this.demoT<=0){
      this.mesh.visible=true; this.disc.visible=true;
      const s=TEAM[this.team].sign;
      this.reset(new V3((Math.random()-0.5)*50,RIDE,s*(AZ-16)),s>0?Math.PI:0,33);
      burst(this.pos,26,TEAM[this.team].col,26,0.6);
    }
    return;
  }
  if(this.groundLock>0) this.groundLock-=dt;
  if(this.dodgeWin>0) this.dodgeWin-=dt;
  if(this.dodgeT>0) this.dodgeT-=dt;
  if(this.aerialT>0) this.aerialT-=dt;

  const d=sdf(this.pos.x,this.pos.y,this.pos.z);
  sdNormal(this.pos,tmpN);
  const surfUp=_su.copy(tmpN).negate();

  const spd=this.vel.length();
  if(spd>this.topSpd) this.topSpd=spd;
  const stick=RIDE+0.35+Math.min(spd*0.05,3.2);
  let contact=(d>-stick)&&(this.groundLock<=0);
  if(contact && surfUp.y<0.55 && spd<26) contact=false;

  if(contact){
    if(!this.grounded){
      if(this.vel.dot(surfUp)<-22) burst(this.pos,8,0xaad4ff,12,0.3);
      this.angVel.set(0,0,0);
    }
    this.grounded=true; this.jumps=0;
    this.pos.addScaledVector(surfUp,d+RIDE);

    let f=_f.copy(this.fwd);
    f.addScaledVector(surfUp,-f.dot(surfUp));
    if(f.lengthSq()<0.02){ f.copy(this.right).cross(surfUp); }
    f.normalize();
    this.up.copy(surfUp);

    let vF=this.vel.dot(f);
    const turnRate=3.55/(1+Math.abs(vF)*0.0165);
    const drifting=inp.drift&&Math.abs(vF)>10;
    const steer=inp.steer*(drifting?1.4:1.0);
    if(Math.abs(vF)>0.6||inp.throttle!==0){
      const ang=turnRate*steer*dt*(vF<-0.5?-1:1);
      f.applyAxisAngle(surfUp,-ang).normalize();
    }
    this.fwd.copy(f);
    this.right.copy(f).cross(surfUp).normalize();

    vF=this.vel.dot(this.fwd);
    let vR=this.vel.dot(this.right);
    const dmax=DRIVE_MAX*SPD_MUL;

    let acc=0;
    if(inp.throttle>0){
      acc=(vF<dmax? 48*(1-clamp(vF/dmax,0,1)*0.72) : 0)*inp.throttle;
      if(vF<0) acc=62;
    } else if(inp.throttle<0){
      acc=(vF>1)? -70 : -30;
    } else {
      vF-=Math.sign(vF)*Math.min(Math.abs(vF),22*dt);
    }
    vF+=acc*dt;
    if(vF<-32) vF=-32;

    const grip=(drifting?8:58);
    if(drifting&&Math.abs(vR)>13&&Math.random()<0.6){
      emit(this.pos.clone().addScaledVector(this.up,-1),
        this.vel.clone().multiplyScalar(0.2).add(new V3(0,4,0)),0x8fa8c8,0.45,7,0.25);
    }
    vR-=Math.sign(vR)*Math.min(Math.abs(vR),grip*dt);

    this.vel.copy(this.fwd).multiplyScalar(vF).addScaledVector(this.right,vR);
    this.vel.addScaledVector(surfUp,-Math.min(spd*0.10,7));

    if(inp.jump&&inp.jumpEdge){
      this.vel.addScaledVector(this.up,JUMP_IMP);
      this.grounded=false; this.groundLock=0.12; this.jumps=1; this.dodgeWin=1.35;
      burst(this.pos.clone().addScaledVector(this.up,-1),5,0x9fd8ff,9,0.25);
      SFX.jump();
    }
    this.syncQuat();
  } else {
    this.grounded=false;
    this.vel.y-=G*dt;

    if(this.dodgeT<=0){
      const P=13.5,Y=10.5,R=15.5,DMP=4.2;
      let ap=0,ay=0,ar=0;
      if(inp.drift){ ar=inp.steer; ap=-inp.throttle; }
      else { ap=-inp.throttle; ay=inp.steer; }
      if(ap) this.angVel.addScaledVector(this.right,ap*P*dt);
      else this.angVel.addScaledVector(this.right,-this.angVel.dot(this.right)*Math.min(1,DMP*dt));
      if(ay) this.angVel.addScaledVector(this.up,-ay*Y*dt);
      else this.angVel.addScaledVector(this.up,-this.angVel.dot(this.up)*Math.min(1,DMP*dt));
      if(ar) this.angVel.addScaledVector(this.fwd,-ar*R*dt);
      else this.angVel.addScaledVector(this.fwd,-this.angVel.dot(this.fwd)*Math.min(1,DMP*dt));
      const al=this.angVel.length();
      if(al>6.0) this.angVel.multiplyScalar(6.0/al);
    }

    if(inp.jump&&inp.jumpEdge&&this.jumps>0&&this.dodgeWin>0){
      this.jumps=0;
      const df=inp.throttle, dr=inp.steer;
      if(Math.abs(df)>0.25||Math.abs(dr)>0.25){
        const dir=this.fwd.clone().multiplyScalar(df).addScaledVector(this.right,dr).normalize();
        this.vel.addScaledVector(dir,DODGE_IMP);
        if(df<-0.3) this.vel.y+=11;
        const axis=dir.clone().cross(this.up).normalize();
        this.angVel.copy(axis).multiplyScalar(-9.2);
        this.dodgeT=0.62;
        burst(this.pos,10,TEAM[this.team].col,15,0.35);
        SFX.dodge();
      } else {
        this.vel.addScaledVector(this.up,JUMP2_IMP);
        burst(this.pos.clone().addScaledVector(this.up,-1),6,0x9fd8ff,10,0.25);
        SFX.jump();
      }
    }

    const al=this.angVel.length();
    if(al>1e-4){
      tmpV.copy(this.angVel).divideScalar(al);
      this.quat.premultiply(new T.Quaternion().setFromAxisAngle(tmpV,al*dt)).normalize();
      this.readBasis();
    }

    const dd=sdf(this.pos.x,this.pos.y,this.pos.z);
    if(dd>-1.35){
      sdNormal(this.pos,tmpN);
      const inN=_in2.copy(tmpN).negate();
      this.pos.addScaledVector(inN,dd+1.35);
      const vn=this.vel.dot(inN);
      if(vn<0) this.vel.addScaledVector(inN,-vn*1.28);
    }
  }

  if(inp.boost&&(this.boost>0||INF_BOOST)&&this.dodgeT<=0){
    this.vel.addScaledVector(this.fwd,BOOST_ACC*dt);
    if(!INF_BOOST){
      const use=Math.min(this.boost,BOOST_DRAIN*dt);
      this.boost-=use; this.boostUsed+=use;
    } else this.boostUsed+=BOOST_DRAIN*dt;
    this.flameLevel=Math.min(1,this.flameLevel+dt*7);
    if(Math.random()<0.85){
      const back=this.pos.clone().addScaledVector(this.fwd,-CAR_L*0.55);
      emit(back,this.vel.clone().multiplyScalar(0.35).addScaledVector(this.fwd,-22),
        Math.random()<0.55?0xff9a3c:0xffe08a,0.32,7,0.15);
    }
    if(this===player) SFX.boost(true);
  } else {
    this.flameLevel=Math.max(0,this.flameLevel-dt*7);
    if(this===player) SFX.boost(false);
  }

  const sp=this.vel.length();
  const cap=MAXSPD*SPD_MUL;
  if(sp>cap) this.vel.multiplyScalar(cap/sp);
  this.pos.addScaledVector(this.vel,dt);
  this.sonic=sp>SUPERSONIC?1:0;
  if(this.sonic&&Math.random()<0.5){
    emit(this.pos.clone().addScaledVector(this.fwd,-CAR_L*0.6),
      this.vel.clone().multiplyScalar(0.1),0x66f0dd,0.3,4,0.05);
  }

  for(let i=0;i<pads.length;i++){
    const pd=pads[i];
    if(pd.t>0) continue;
    const dx=this.pos.x-pd.x, dz=this.pos.z-pd.z;
    if(this.pos.y<7 && dx*dx+dz*dz<pd.r*pd.r){
      const gain=pd.big?100:12.5;
      if(this.boost<TANK-0.5||pd.big){
        this.boost=Math.min(TANK,this.boost+gain);
        pd.t=pd.big?10:4;
        burst(new V3(pd.x,1.5,pd.z),pd.big?18:7,pd.big?0xffd23f:0x66f0dd,pd.big?20:11,0.5);
        if(this===player) SFX.pad(pd.big);
      }
    }
  }
};

Car.prototype.render=function(dt){
  this.mesh.position.copy(this.pos);
  this.mesh.quaternion.copy(this.quat);
  const vf=this.vel.dot(this.fwd);
  this.wheelSpin+=vf*dt*1.05;
  for(let i=0;i<4;i++) this.wheels[i].rotation.x=this.wheelSpin;
  const fl=this.flameLevel;
  for(let i=0;i<2;i++){
    const f=this.flames[i];
    f.material.opacity=fl*0.85;
    const s=0.55+fl*(0.75+Math.random()*0.5);
    f.scale.set(s,s*(0.7+Math.random()*0.6),s);
  }
  const dd=sdf(this.pos.x,this.pos.y,this.pos.z);
  sdNormal(this.pos,tmpN);          // outward
  _bk.copy(tmpN).negate();          // inward
  // the contact glow sits on the surface and faces back into the arena
  this.disc.position.copy(this.pos).addScaledVector(tmpN,-dd).addScaledVector(_bk,0.08);
  this.disc.quaternion.setFromUnitVectors(_zAxis,_bk);
  this.disc.material.opacity=clamp(0.34-Math.abs(dd+RIDE)*0.05,0,0.34);
};

/* ============================================================
   MATCH STATE
   ============================================================ */
const state={
  phase:'menu',
  mode:1, diff:1, minutes:5, mut:0, fs:1, music:1, q:2,
  score:[0,0], clock:300, ot:false,
  kickT:0, goalT:0, lastTouch:-1, lastShooter:null, onTarget:false,
  shake:0, camMode:0, flash:0, training:false
};
let cars=[], player=null;

/* ---- goal replay recorder ---- */
const REC_HZ=25, REC_SEC=6, REC_N=REC_HZ*REC_SEC;
const rec={frames:[], head:0, count:0, t:0};
function initRec(n){
  rec.frames=[]; rec.head=0; rec.count=0; rec.t=0;
  for(let i=0;i<REC_N;i++){
    const f={ball:new V3(), cars:[]};
    for(let c=0;c<n;c++) f.cars.push({p:new V3(),q:new T.Quaternion(),vis:true});
    rec.frames.push(f);
  }
}
function recordFrame(){
  const f=rec.frames[rec.head];
  f.ball.copy(ball.pos);
  for(let i=0;i<cars.length;i++){
    f.cars[i].p.copy(cars[i].pos);
    f.cars[i].q.copy(cars[i].quat);
    f.cars[i].vis=cars[i].demoT<=0;
  }
  rec.head=(rec.head+1)%REC_N;
  rec.count=Math.min(rec.count+1,REC_N);
}
const replay={on:false,t:0,dur:0,camA:0,anchor:new V3()};

function spawnPositions(team,n,variant){
  const s=TEAM[team].sign, o=[];
  if(n===1){
    const spots=[[0,80],[-46,70],[46,70],[-72,58],[72,58]];
    const p=spots[variant%spots.length];
    o.push([p[0],s*p[1]]);
  } else if(n===2){
    o.push([-30,s*76],[30,s*76]);
    if(variant%2===1){ o[0][0]=-64; o[1][0]=64; }
  } else {
    o.push([-46,s*70],[0,s*80],[46,s*70]);
  }
  return o.map(function(p){return new V3(p[0],RIDE,p[1]);});
}
function buildTeams(){
  cars.forEach(function(c){scene.remove(c.mesh);scene.remove(c.disc);});
  cars=[];
  const n=state.mode;
  const opp=state.training?0:n;
  for(let i=0;i<n;i++){ const c=new Car(0,i!==0,i); cars.push(c); if(i===0) player=c; }
  for(let i=0;i<opp;i++) cars.push(new Car(1,true,i));
  initRec(cars.length);
}
let kickVariant=0;
function kickoff(){
  kickVariant=(Math.random()*5)|0;
  ball.pos.set(0,BR,0); ball.vel.set(0,0,0);
  for(let i=0;i<TRAIL;i++) trailHist[i].copy(ball.pos);
  for(let t=0;t<2;t++){
    const list=cars.filter(function(c){return c.team===t;});
    const sp=spawnPositions(t,Math.max(1,list.length),kickVariant);
    list.forEach(function(c,i){ c.reset(sp[i%sp.length], t===0?0:Math.PI, 33); });
  }
  pads.forEach(function(p){p.t=0;});
  state.phase='kickoff'; state.kickT=3.05; state.lastTouch=-1; state.onTarget=false;
  rec.count=0; rec.head=0;
  $('goalCard').classList.remove('on');
  endReplay();
  MUSIC.intensity(1);
}

/* ============================================================
   INPUT
   ============================================================ */
const keys={};
const touchState={left:0,right:0,gas:0,brake:0,jump:0,boost:0};
let jumpHeldPrev=false;

addEventListener('keydown',function(e){
  if(e.repeat){keys[e.code]=true;return;}
  keys[e.code]=true;
  if(e.code==='Escape'){ togglePause(); e.preventDefault(); }
  if(e.code==='KeyC'&&state.phase!=='menu'){ state.camMode=1-state.camMode; toast(state.camMode?'KAMERA: AUTO':'KAMERA: BALL'); }
  if(e.code==='KeyM'){ SFX.toggle(); toast(SFX.muted?'TON AUS':'TON AN'); }
  if(e.code==='KeyN'){ toggleMusic(); }
  if(e.code==='KeyF'){ toggleFS(); }
  if(e.code==='KeyR'&&(state.phase==='play')&&replayAvailable()) startReplay(2.6);
  const n=['Digit1','Digit2','Digit3','Digit4'].indexOf(e.code);
  if(n>=0&&state.phase!=='menu') quickChat(0,n);
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','ShiftLeft','ShiftRight'].indexOf(e.code)>=0) e.preventDefault();
});
addEventListener('keyup',function(e){keys[e.code]=false;});
addEventListener('blur',function(){for(const k in keys)keys[k]=false;});

(function initTouch(){
  if(!(('ontouchstart' in window)||navigator.maxTouchPoints>0)) return;
  $('touch').classList.add('on');
  Array.prototype.forEach.call(document.querySelectorAll('.tbtn'),function(el){
    const k=el.getAttribute('data-k');
    const on=function(e){e.preventDefault();touchState[k]=1;el.classList.add('hit');};
    const off=function(e){e.preventDefault();touchState[k]=0;el.classList.remove('hit');};
    el.addEventListener('touchstart',on,{passive:false});
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('touchcancel',off,{passive:false});
    el.addEventListener('mousedown',on); el.addEventListener('mouseup',off);
    el.addEventListener('mouseleave',off);
  });
})();

function readPad(){
  if(!navigator.getGamepads) return null;
  const gs=navigator.getGamepads();
  for(let i=0;i<gs.length;i++) if(gs[i]&&gs[i].connected) return gs[i];
  return null;
}
let steerRamp=0;
function playerInput(dt){
  const inp={throttle:0,steer:0,jump:false,jumpEdge:false,boost:false,drift:false};
  if(keys['KeyW']||keys['ArrowUp']||touchState.gas) inp.throttle+=1;
  if(keys['KeyS']||keys['ArrowDown']||touchState.brake) inp.throttle-=1;
  if(keys['KeyD']||keys['ArrowRight']||touchState.right) inp.steer+=1;
  if(keys['KeyA']||keys['ArrowLeft']||touchState.left) inp.steer-=1;
  inp.jump=!!(keys['Space']||touchState.jump);
  inp.boost=!!(keys['ShiftLeft']||keys['ShiftRight']||touchState.boost);
  inp.drift=!!(keys['ControlLeft']||keys['ControlRight']||keys['KeyX']);

  const gp=readPad();
  if(gp){
    const ax=gp.axes[0]||0;
    if(Math.abs(ax)>0.14) inp.steer=clamp(inp.steer+ax,-1,1);
    const rt=gp.buttons[7]?gp.buttons[7].value:0;
    const lt=gp.buttons[6]?gp.buttons[6].value:0;
    if(rt>0.1) inp.throttle=clamp(inp.throttle+rt,-1,1);
    if(lt>0.1) inp.throttle=clamp(inp.throttle-lt,-1,1);
    if(gp.buttons[0]&&gp.buttons[0].pressed) inp.jump=true;
    if((gp.buttons[1]&&gp.buttons[1].pressed)||(gp.buttons[2]&&gp.buttons[2].pressed)) inp.boost=true;
    if((gp.buttons[4]&&gp.buttons[4].pressed)||(gp.buttons[5]&&gp.buttons[5].pressed)) inp.drift=true;
  }
  const raw=clamp(inp.steer,-1,1);
  // a short ramp — releasing snaps back faster than turning in, which keeps
  // hard taps precise without the twitch of a raw on/off input
  const rate=(Math.abs(raw)<Math.abs(steerRamp))?34:20;
  steerRamp+=(raw-steerRamp)*Math.min(1,rate*dt);
  if(Math.abs(raw-steerRamp)<0.02) steerRamp=raw;
  inp.steer=steerRamp;
  inp.throttle=clamp(inp.throttle,-1,1);
  inp.jumpEdge=inp.jump&&!jumpHeldPrev;
  jumpHeldPrev=inp.jump;
  return inp;
}

/* ============================================================
   BALL PREDICTION — the AI's crystal ball, and the reason it
   meets the ball instead of chasing it.
   ============================================================ */
const PRED_N=105, PRED_DT=1/30;
const predP=[];
for(let i=0;i<PRED_N;i++) predP.push(new V3());
let predValid=0;
const _pp=new V3(), _pv=new V3(), _pn=new V3();
function predictBall(){
  _pp.copy(ball.pos); _pv.copy(ball.vel);
  for(let i=0;i<PRED_N;i++){
    _pv.y-=G*PRED_DT;
    _pv.multiplyScalar(Math.max(0,1-BALL_DRAG*PRED_DT));
    _pp.addScaledVector(_pv,PRED_DT);
    const d=sdf(_pp.x,_pp.y,_pp.z);
    if(d>-BR){
      sdNormal(_pp,_pn);
      const n=_pn.clone().negate();
      _pp.addScaledVector(n,BR+d);
      const vn=_pv.dot(n);
      if(vn<0){
        const tg=_pv.clone().addScaledVector(n,-vn).multiplyScalar(1-BALL_FRIC*0.35);
        _pv.copy(tg).addScaledVector(n,-vn*BALL_BOUNCE);
      }
    }
    predP[i].copy(_pp);
  }
  predValid=PRED_N;
}
// where (and when) the ball crosses a goal plane, if at all
function goalThreat(sign){
  for(let i=0;i<PRED_N;i++){
    const p=predP[i];
    if(sign<0? p.z<-AZ+2 : p.z>AZ-2){
      if(Math.abs(p.x)<GHW+6 && p.y<GH+4) return {i:i,t:i*PRED_DT,p:p};
    }
  }
  return null;
}

/* ============================================================
   AI
   ============================================================ */
const aiTmp=new V3();
function assignRoles(){
  for(let t=0;t<2;t++){
    const list=cars.filter(function(c){return c.team===t&&c.demoT<=0;});
    if(!list.length) continue;
    list.sort(function(a,b){ return a.pos.distanceToSquared(ball.pos)-b.pos.distanceToSquared(ball.pos); });
    for(let i=0;i<list.length;i++) list[i].role=(i===0)?'attack':(i===1?'support':'defend');
    const threat=goalThreat(TEAM[t].sign);
    if(threat&&threat.t<2.6&&list.length>1) list[list.length-1].role='goalie';
    else if(threat&&threat.t<1.4) list[0].role='goalie';
  }
}

function aiInput(car,dt){
  const D=DIFF[state.diff];
  const inp={throttle:0,steer:0,jump:false,jumpEdge:false,boost:false,drift:false};
  const sign=TEAM[car.team].sign;
  const ownGoal=new V3(0,0,sign*AZ);
  const oppGoal=new V3(0,0,-sign*AZ);

  car.think-=dt;
  if(car.think<=0){
    car.think=D.react;

    // pick the earliest point on the predicted path this car can actually reach
    const cruise=(car.boost>14?80:58)*D.speed;
    let iSel=-1;
    const horizon=Math.min(PRED_N,Math.round(D.pred/PRED_DT));
    for(let i=2;i<horizon;i+=2){
      const p=predP[i];
      const reach=car.pos.distanceTo(p)/cruise;
      if(reach<=i*PRED_DT){ iSel=i; break; }
    }
    if(iSel<0) iSel=Math.min(horizon-1,PRED_N-1);
    const hit=predP[iSel].clone();
    car.interceptT=iSel*PRED_DT;
    car.interceptY=hit.y;

    let target;
    if(car.role==='goalie'){
      const th=goalThreat(sign);
      if(th){
        target=new V3(clamp(th.p.x,-GHW+4,GHW-4),RIDE,sign*(AZ-9));
        // close enough to challenge? then go through the ball instead
        if(car.pos.distanceTo(ball.pos)<34) target=hit.clone();
      } else {
        target=new V3(clamp(ball.pos.x*0.55,-GHW,GHW),RIDE,sign*(AZ-11));
      }
    } else if(car.role==='defend'){
      target=ownGoal.clone().lerp(ball.pos,0.42);
      target.x=clamp(target.x,-64,64);
    } else if(car.role==='support'){
      target=ball.pos.clone().lerp(ownGoal,0.30);
      target.x+=(car.pos.x<ball.pos.x?-34:34);
    } else {
      const toGoal=oppGoal.clone().sub(hit); toGoal.y=0;
      if(toGoal.lengthSq()<1) toGoal.set(0,0,-sign);
      toGoal.normalize();
      target=hit.clone().addScaledVector(toGoal,-(BR+3.2));
      // never approach from the wrong side — that is how own goals happen
      const goalSide=(sign<0)? (car.pos.z>hit.z) : (car.pos.z<hit.z);
      if(goalSide && Math.abs(hit.z-sign*AZ)<70){
        target=hit.clone().addScaledVector(toGoal,-(BR+16));
        target.x+=(car.pos.x>0?20:-20);
      }
    }

    // grab a big pad if it is roughly on the way and the tank is dry
    if(car.boost<22 && car.role!=='goalie'){
      const dir=target.clone().sub(car.pos); dir.y=0;
      const dlen=dir.length();
      if(dlen>34){
        dir.divideScalar(dlen);
        let best=null,bs=1e9;
        for(let i=0;i<pads.length;i++){
          const pd=pads[i];
          if(pd.t>0||!pd.big) continue;
          const rel=new V3(pd.x-car.pos.x,0,pd.z-car.pos.z);
          const along=rel.dot(dir);
          if(along<6||along>dlen+40) continue;
          const off=Math.abs(rel.x*dir.z-rel.z*dir.x);
          const cost=off*1.6+along*0.25;
          if(off<44&&cost<bs){bs=cost;best=pd;}
        }
        if(best) target=new V3(best.x,RIDE,best.z);
      }
    }

    if(D.err>0){
      target.x+=(Math.random()-0.5)*D.err*2;
      target.z+=(Math.random()-0.5)*D.err*2;
    }
    target.x=clamp(target.x,-AX+8,AX-8);
    target.z=clamp(target.z,-AZ+6,AZ-6);
    car.aim.copy(target);
  }

  const to=car.aim.clone().sub(car.pos); to.y=0;
  const dist=to.length();
  if(dist<0.01) return inp;
  to.normalize();
  const f=car.fwd.clone(); f.y=0;
  if(f.lengthSq()<0.001) return inp;
  f.normalize();
  const ang=Math.atan2(f.x*to.z-f.z*to.x, clamp(f.dot(to),-1,1));

  inp.steer=clamp(-ang*2.5,-1,1);
  if(Math.abs(ang)>2.25 && dist<26){ inp.throttle=-1; inp.steer*=-1; }
  else inp.throttle=1;

  const spd=car.vel.length();
  if(Math.abs(ang)>1.05 && spd>44) inp.drift=true;
  if(spd>DRIVE_MAX*D.speed*1.45 && Math.abs(ang)>0.5) inp.throttle=0;

  const bd=car.pos.distanceTo(ball.pos);
  inp.boost = Math.abs(ang)<0.30 && (dist>24||bd<20) && (car.boost>5||INF_BOOST) &&
              Math.random()<D.boost && spd<MAXSPD*0.94;

  // kickoff: everyone sprints, then speed-flips into the ball
  if(state.phase==='kickoff'||(state.phase==='play'&&state.kickT>-0.9)){
    inp.boost=car.boost>0||INF_BOOST;
    if(bd<26&&bd>13&&car.grounded&&Math.abs(ang)<0.4){ inp.jump=true; car._flip=1; }
    else if(car._flip===1&&!car.grounded){ inp.jump=true; inp.throttle=1; car._flip=2; }
  }

  // aerial: commit when the intercept sits in the air and we can afford it
  const hy=car.interceptY||0;
  if(car.role==='attack'&&hy>11&&bd<52&&Math.abs(ang)<0.45&&(car.boost>28||INF_BOOST)&&Math.random()<D.aerial){
    if(car.grounded&&car.aerialT<=0){ inp.jump=true; car.aerialT=1.5; }
  }
  if(car.aerialT>0&&!car.grounded){
    inp.boost=true;
    const want=ball.pos.clone().sub(car.pos).normalize();
    const pitchErr=car.fwd.dot(want);
    const upErr=car.up.dot(want);
    inp.throttle=clamp(-upErr*2.2,-1,1);
    const side=car.right.dot(want);
    inp.steer=clamp(side*2.0,-1,1);
    if(pitchErr>0.93) inp.throttle*=0.3;
    if(bd<BR+5.0&&car.jumps>0){ inp.jump=true; }
  }

  // low, close and airborne: pop up for the header
  if(bd<15 && ball.pos.y>5.5 && car.grounded && Math.abs(ang)<0.7 && Math.random()<0.3*D.aerial+0.1) inp.jump=true;

  // demolition hunt
  if(D.demo>0 && car.role!=='goalie' && car.boost>40 && Math.random()<D.demo*0.02){
    let vic=null,vd=1e9;
    for(let i=0;i<cars.length;i++){
      const o=cars[i];
      if(o.team===car.team||o.demoT>0) continue;
      const dd=car.pos.distanceTo(o.pos);
      if(dd<70&&dd<vd){vd=dd;vic=o;}
    }
    if(vic) car.aim.copy(vic.pos).addScaledVector(vic.vel,0.35);
  }

  inp.jumpEdge=inp.jump&&!car._jp;
  car._jp=inp.jump;
  return inp;
}

/* ============================================================
   BALL PHYSICS + COLLISIONS
   ============================================================ */
function stepBall(dt){
  ball.vel.y-=G*dt;
  ball.vel.multiplyScalar(Math.max(0,1-BALL_DRAG*dt));
  const s=ball.vel.length();
  if(s>BALL_MAX) ball.vel.multiplyScalar(BALL_MAX/s);
  ball.pos.addScaledVector(ball.vel,dt);

  const d=sdf(ball.pos.x,ball.pos.y,ball.pos.z);
  if(d>-BR){
    sdNormal(ball.pos,tmpN);
    const n=tmpN.clone().negate();
    ball.pos.addScaledVector(n,BR+d);
    const vn=ball.vel.dot(n);
    if(vn<0){
      const tang=ball.vel.clone().addScaledVector(n,-vn);
      ball.vel.copy(tang.multiplyScalar(1-BALL_FRIC*Math.min(1,dt*34)))
        .addScaledVector(n,-vn*BALL_BOUNCE);
      if(-vn>16){
        SFX.thud(Math.min(1,-vn/70));
        burst(ball.pos.clone().addScaledVector(n,-BR*0.6),Math.min(14,Math.round(-vn/6)),0x8fd8ff,-vn*0.25,0.35);
        if(-vn>48) shockwave(ball.pos.clone().addScaledVector(n,-BR*0.5),0x8fd8ff,26,0.5,n.clone().negate());
      }
    }
  }
}

function onTargetAfterHit(){
  const p=ball.pos.clone(), v=ball.vel.clone();
  for(let i=0;i<70;i++){
    v.y-=G*(1/30);
    p.addScaledVector(v,1/30);
    if(Math.abs(p.z)>AZ-1){
      return (Math.abs(p.x)<GHW&&p.y>0&&p.y<GH)? (p.z>0?1:0) : -1;
    }
    if(p.y<0) return -1;
  }
  return -1;
}

function carBall(car){
  const inv=car.quat.clone().invert();
  const local=ball.pos.clone().sub(car.pos).applyQuaternion(inv);
  const hx=CAR_W/2+0.15, hy=CAR_H/2+0.1, hz=CAR_L/2+0.15;
  const cx=clamp(local.x,-hx,hx), cy2=clamp(local.y,-hy,hy), cz=clamp(local.z,-hz,hz);
  const dx=local.x-cx, dy=local.y-cy2, dz=local.z-cz;
  let dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
  if(dist>BR) return;

  let nl;
  if(dist<1e-4){ nl=new V3(0,1,0); dist=0; }
  else nl=new V3(dx/dist,dy/dist,dz/dist);
  const n=nl.applyQuaternion(car.quat).normalize();

  ball.pos.copy(car.pos).add(new V3(cx,cy2,cz).applyQuaternion(car.quat)).addScaledVector(n,BR+0.05);

  const rel=ball.vel.clone().sub(car.vel);
  const vn=rel.dot(n);
  if(vn<0){
    const e=0.58;
    const j=-(1+e)*vn/(1/BALL_MASS+1/CAR_MASS);
    ball.vel.addScaledVector(n,j/BALL_MASS);
    car.vel.addScaledVector(n,-j/CAR_MASS*0.42);
  }
  const cs=car.vel.dot(n);
  if(cs>0) ball.vel.addScaledVector(n,Math.min(cs,72)*0.56);
  const bs=ball.vel.length();
  if(bs>BALL_MAX) ball.vel.multiplyScalar(BALL_MAX/bs);

  car.touches++;

  // shot / save bookkeeping
  const tgt=onTargetAfterHit();
  if(state.onTarget && state.lastShooter && state.lastShooter.team!==car.team){
    car.saves++;
    if(car===player){ toast('PARADE'); }
    else if(Math.random()<0.4) quickChat(car.team,5,car);
    state.onTarget=false;
  }
  if(tgt>=0 && tgt!==car.team){ car.shots++; state.onTarget=true; state.lastShooter=car; }
  else if(tgt<0) state.onTarget=false;

  state.lastTouch=car.team;
  const power=Math.min(1,Math.abs(vn)/60+car.vel.length()/120);
  SFX.hit(power);
  burst(ball.pos.clone().addScaledVector(n,-BR*0.7),4+Math.round(power*16),
    TEAM[car.team].col,18+power*32,0.35);
  if(power>0.55) shockwave(ball.pos.clone(),TEAM[car.team].col,16+power*22,0.4,n.clone().negate());
  if(car===player) state.shake=Math.max(state.shake,power*0.9);
}

function carCar(a,b){
  const dv=b.pos.clone().sub(a.pos);
  const dist=dv.length();
  const R=3.3;
  if(dist>R*2||dist<1e-4) return;
  const n=dv.divideScalar(dist);
  const pen=R*2-dist;
  a.pos.addScaledVector(n,-pen*0.5);
  b.pos.addScaledVector(n, pen*0.5);
  const rel=b.vel.clone().sub(a.vel);
  const vn=rel.dot(n);
  if(vn<0){
    const j=-1.25*vn/2;
    a.vel.addScaledVector(n,-j);
    b.vel.addScaledVector(n, j);
    if(-vn>30){ SFX.thud(0.6); burst(a.pos.clone().lerp(b.pos,0.5),10,0xffd23f,20,0.4); }
  }
  if(a.team!==b.team){
    const fast=a.vel.length()>SUPERSONIC?a:(b.vel.length()>SUPERSONIC?b:null);
    if(fast){
      const victim=(fast===a)?b:a;
      if(victim.demoT<=0){
        victim.demoT=2.4; fast.demos++;
        burst(victim.pos,54,TEAM[victim.team].col,46,0.9);
        burst(victim.pos,26,0xffffff,32,0.6);
        shockwave(victim.pos.clone(),0xffffff,34,0.5);
        SFX.demo();
        if(victim===player){ state.shake=1.4; state.flash=0.5; }
        toast(victim===player?'ZERLEGT':'GEGNER ZERLEGT');

}

/* ============================================================
   CAMERA
   ============================================================ */
const camPos=new V3(0,40,-170), camLook=new V3(0,0,0);
let menuAngle=0;
function clampCam(p){
  const dd=sdf(p.x,p.y,p.z);
  if(dd>-4){ sdNormal(p,tmpN); p.addScaledVector(tmpN.negate(),dd+4); }
  if(p.y<4) p.y=4;
  return p;
}
function updateCamera(dt){
  if(state.phase==='menu'){
    menuAngle+=dt*0.08;
    camPos.set(Math.sin(menuAngle)*84,26+Math.sin(menuAngle*0.7)*11,Math.cos(menuAngle)*112);
    camLook.set(0,11,0);
    camera.position.lerp(camPos,1-Math.pow(0.001,dt));
    camera.lookAt(camLook);
    return;
  }
  if(replay.on){
    replay.camA+=dt*0.55;
    const r=44+Math.sin(replay.t*0.6)*8;
    const p=new V3(replay.anchor.x+Math.sin(replay.camA)*r, replay.anchor.y+16+Math.sin(replay.camA*0.6)*5,
                   replay.anchor.z+Math.cos(replay.camA)*r);
    clampCam(p);
    camera.position.lerp(p,1-Math.pow(0.02,dt));
    camLook.lerp(ball.pos,1-Math.pow(0.01,dt));
    camera.lookAt(camLook);
    return;
  }
  const car=player;
  const desired=new V3(), look=new V3();
  if(state.camMode===0){
    const toCar=car.pos.clone().sub(ball.pos); toCar.y=0;
    if(toCar.lengthSq()<4) toCar.copy(car.fwd).negate().setY(0);
    toCar.normalize();
    desired.copy(car.pos).addScaledVector(toCar,31).setY(car.pos.y+13);
    look.copy(car.pos).lerp(ball.pos,0.42); look.y+=3.5;
  } else {
    const f=car.fwd.clone(); f.y*=0.35;
    if(f.lengthSq()<0.01) f.set(0,0,1);
    f.normalize();
    desired.copy(car.pos).addScaledVector(f,-30).setY(car.pos.y+12);
    look.copy(car.pos).addScaledVector(f,26); look.y+=3;
  }
  clampCam(desired);

  camPos.lerp(desired,1-Math.exp(-22*dt));
  camLook.lerp(look,1-Math.exp(-18*dt));
  camera.position.copy(camPos);
  if(state.shake>0.001&&!REDUCED){
    state.shake*=Math.pow(0.05,dt);
    const s=state.shake;
    camera.position.x+=(Math.random()-0.5)*s*3.4;
    camera.position.y+=(Math.random()-0.5)*s*3.4;
    camera.position.z+=(Math.random()-0.5)*s*3.4;
  } else state.shake=0;
  camera.lookAt(camLook);
}

/* ============================================================
   AUDIO — synth SFX + a procedural synthwave score. No files.
   ============================================================ */
const AUDIO={ctx:null,master:null,sfxBus:null,musBus:null};
function audioInit(){
  if(AUDIO.ctx) return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC) return;
  const ctx=new AC();
  AUDIO.ctx=ctx;
  const comp=ctx.createDynamicsCompressor();
  comp.threshold.value=-14; comp.ratio.value=7; comp.attack.value=0.004; comp.release.value=0.22;
  const master=ctx.createGain(); master.gain.value=0.85;
  comp.connect(master); master.connect(ctx.destination);
  AUDIO.master=master; AUDIO.out=comp;
  const sfx=ctx.createGain(); sfx.gain.value=0.55; sfx.connect(comp);
  const mus=ctx.createGain(); mus.gain.value=0.0; mus.connect(comp);
  AUDIO.sfxBus=sfx; AUDIO.musBus=mus;
}

const SFX=(function(){
  let eng=null,engGain=null,engFilter=null,boostGain=null,muted=false;
  function build(){
    const ctx=AUDIO.ctx; if(!ctx||eng) return;
    eng=ctx.createOscillator(); eng.type='sawtooth'; eng.frequency.value=70;
    engFilter=ctx.createBiquadFilter(); engFilter.type='lowpass'; engFilter.frequency.value=430;
    engGain=ctx.createGain(); engGain.gain.value=0;
    eng.connect(engFilter); engFilter.connect(engGain); engGain.connect(AUDIO.sfxBus); eng.start();

    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*0.5;
    const bs=ctx.createBufferSource(); bs.buffer=buf; bs.loop=true;
    const bf=ctx.createBiquadFilter(); bf.type='bandpass'; bf.frequency.value=980; bf.Q.value=0.8;
    boostGain=ctx.createGain(); boostGain.gain.value=0;
    bs.connect(bf); bf.connect(boostGain); boostGain.connect(AUDIO.sfxBus); bs.start();
  }
  function blip(freq,dur,type,vol,slide){
    const ctx=AUDIO.ctx; if(!ctx||muted) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type||'sine'; o.frequency.value=freq;
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),ctx.currentTime+dur);
    g.gain.value=0; g.gain.linearRampToValueAtTime(vol,ctx.currentTime+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g); g.connect(AUDIO.sfxBus); o.start(); o.stop(ctx.currentTime+dur+0.02);
  }
  function noise(dur,vol,f0,f1){
    const ctx=AUDIO.ctx; if(!ctx||muted) return;
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const b=ctx.createBuffer(1,len,ctx.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=ctx.createBufferSource(); s.buffer=b;
    const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=f0;
    if(f1) f.frequency.exponentialRampToValueAtTime(f1,ctx.currentTime+dur);
    const g=ctx.createGain(); g.gain.value=vol;
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    s.connect(f); f.connect(g); g.connect(AUDIO.sfxBus); s.start();
  }
  return {
    get muted(){return muted;},
    unlock:function(){ audioInit(); build(); if(AUDIO.ctx&&AUDIO.ctx.state==='suspended') AUDIO.ctx.resume(); },
    toggle:function(){ muted=!muted; if(AUDIO.master) AUDIO.master.gain.value=muted?0:0.85; },
    engine:function(spd,thr){
      const ctx=AUDIO.ctx; if(!ctx||muted||!eng) return;
      engFilter.frequency.setTargetAtTime(360+spd*7,ctx.currentTime,0.08);
      eng.frequency.setTargetAtTime(62+spd*2.6,ctx.currentTime,0.06);
      engGain.gain.setTargetAtTime(0.03+Math.abs(thr)*0.045+spd*0.0008,ctx.currentTime,0.1);
    },
    boost:function(on){
      const ctx=AUDIO.ctx; if(!ctx||muted||!boostGain) return;
      boostGain.gain.setTargetAtTime(on?0.12:0,ctx.currentTime,0.05);
    },
    hit:function(p){ blip(120+p*90,0.16,'triangle',0.16+p*0.2,60); noise(0.09,0.10+p*0.14,1500,400); },
    thud:function(p){ blip(78,0.14,'sine',0.10*p+0.04,45); noise(0.06,0.05*p,700,260); },
    jump:function(){ blip(300,0.09,'square',0.05,520); },
    dodge:function(){ noise(0.14,0.09,1800,500); },
    pad:function(big){ blip(big?520:700,0.11,'square',0.07,big?1050:900); },
    demo:function(){ noise(0.45,0.3,2200,180); blip(70,0.5,'sawtooth',0.2,32); },
    count:function(last){ blip(last?880:520,last?0.3:0.13,'square',0.11,last?880:520); },
    goal:function(){ noise(0.7,0.28,2600,200); },
    chat:function(){ blip(880,0.06,'square',0.04,1100); },
    whistle:function(){ blip(1500,0.18,'square',0.09,1200); }
  };
})();

/* --- procedural synthwave score --- */
const MUSIC=(function(){
  let on=true, running=false, step=0, nextT=0, timer=null, level=0, delay=null, fb=null;
  const BPM=126, SPB=60/BPM/4;
  const PROG=[[57,60,64,69],[53,57,60,65],[48,52,55,60],[55,59,62,67]];
  const ARP=[0,2,1,3,2,1,3,2];
  function f(m){ return 440*Math.pow(2,(m-69)/12); }
  function ensure(){
    const ctx=AUDIO.ctx; if(!ctx||delay) return;
    delay=ctx.createDelay(1.0); delay.delayTime.value=SPB*3;
    fb=ctx.createGain(); fb.gain.value=0.34;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2400;
    delay.connect(fb); fb.connect(lp); lp.connect(delay); delay.connect(AUDIO.musBus);
  }
  function env(node,t,a,d,peak){
    node.gain.setValueAtTime(0.0001,t);
    node.gain.linearRampToValueAtTime(peak,t+a);
    node.gain.exponentialRampToValueAtTime(0.0001,t+a+d);
  }
  function tone(t,freq,dur,type,vol,dest,detune){
    const ctx=AUDIO.ctx;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t);
    if(detune) o.detune.setValueAtTime(detune,t);
    env(g,t,0.006,dur,vol);
    o.connect(g); g.connect(dest||AUDIO.musBus);
    o.start(t); o.stop(t+dur+0.06);
  }
  function kick(t){
    const ctx=AUDIO.ctx;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(155,t);
    o.frequency.exponentialRampToValueAtTime(42,t+0.11);
    env(g,t,0.003,0.24,0.62);
    o.connect(g); g.connect(AUDIO.musBus); o.start(t); o.stop(t+0.32);
  }
  function nz(t,dur,vol,f0,q,type){
    const ctx=AUDIO.ctx;
    const len=Math.max(1,Math.floor(ctx.sampleRate*dur));
    const b=ctx.createBuffer(1,len,ctx.sampleRate), ch=b.getChannelData(0);
    for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*(1-i/len);
    const s=ctx.createBufferSource(); s.buffer=b;
    const bf=ctx.createBiquadFilter(); bf.type=type||'highpass'; bf.frequency.value=f0; bf.Q.value=q||1;
    const g=ctx.createGain(); g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(bf); bf.connect(g); g.connect(AUDIO.musBus); s.start(t);
  }
  function playStep(s,t){
    const bar=Math.floor(s/16)%4;
    const ch=PROG[bar];
    const root=ch[0]-24;
    if(s%4===0) kick(t);
    if(level>=1&&(s%16===4||s%16===12)) nz(t,0.16,0.24,1500,0.8,'highpass');
    if(s%2===1) nz(t,0.045,level>=1?0.10:0.05,7000,1,'highpass');
    // bass
    const bn=(s%8===6)? root+7 : root;
    if(s%2===0) tone(t,f(bn),SPB*1.7,'sawtooth',0.20,AUDIO.musBus);
    // pad
    if(s%16===0){
      for(let i=0;i<3;i++){
        tone(t,f(ch[i]-12),SPB*15,'sawtooth',0.045,AUDIO.musBus,-7);
        tone(t,f(ch[i]-12),SPB*15,'sawtooth',0.045,AUDIO.musBus,+7);
      }
    }
    // arpeggio
    if(level>=1){
      const n=ch[ARP[s%8]]+12;
      tone(t,f(n),SPB*0.9,'square',level>=2?0.075:0.055,delay||AUDIO.musBus);
    }
    if(level>=2&&s%8===0) tone(t,f(ch[0]+12),SPB*3.2,'sawtooth',0.05,AUDIO.musBus,+9);
  }
  function tick(){
    const ctx=AUDIO.ctx; if(!ctx) return;
    while(nextT<ctx.currentTime+0.18){
      if(nextT<ctx.currentTime) nextT=ctx.currentTime+0.02;
      try{ playStep(step,nextT); }catch(e){}
      nextT+=SPB; step=(step+1)%64;
    }
  }
  return {
    start:function(){
      audioInit(); ensure();
      if(!AUDIO.ctx||running) return;
      running=true; nextT=AUDIO.ctx.currentTime+0.1;
      timer=setInterval(tick,30);
      this.setOn(on);
    },
    setOn:function(v){
      on=v;
      if(AUDIO.musBus&&AUDIO.ctx) AUDIO.musBus.gain.setTargetAtTime(on?0.26:0.0,AUDIO.ctx.currentTime,0.4);
    },
    get on(){return on;},
    intensity:function(l){
      level=l;
      if(AUDIO.musBus&&AUDIO.ctx&&on)
        AUDIO.musBus.gain.setTargetAtTime(l===0?0.16:(l===2?0.30:0.26),AUDIO.ctx.currentTime,0.6);
    },
    stinger:function(col){
      const ctx=AUDIO.ctx; if(!ctx||!on) return;
      const base=col===0?[65,69,72,77]:[62,66,69,74];
      base.forEach(function(m,i){
        setTimeout(function(){ tone(ctx.currentTime,f(m),0.9,'sawtooth',0.10,AUDIO.musBus); },i*70);
      });
    }
  };
})();

function fsActive(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function enterFS(){
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!fn) return Promise.reject();
  try{ const r=fn.call(el); return (r&&r.catch)?r:Promise.resolve(); }
  catch(e){ return Promise.reject(e); }
}
function exitFS(){
  const fn=document.exitFullscreen||document.webkitExitFullscreen;
  if(fn) try{ fn.call(document); }catch(e){}
}
function toggleFS(){
  if(fsActive()) exitFS();
  else enterFS().catch(function(){ toast('VOLLBILD BLOCKIERT'); });
}
$('fsBtn').onclick=toggleFS;

function fmtClock(s){
  s=Math.max(0,s);

  return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;
}

    $('mnu').onclick=function(){ ov.classList.remove('off'); showMenu(); };
  }
}
$('pauseBtn').onclick=togglePause;

function applyMutator(){
  const m=MUT[state.mut];
  G=GRAV0*m.grav; BR=BASE_BALL_R*m.ball; INF_BOOST=m.inf; SPD_MUL=m.spd;
  ballGroup.scale.setScalar(m.ball);
  const p=$('pMut');
  if(state.mut===0) p.style.display='none';
  else { p.style.display=''; p.textContent=m.name; }
}

function startMatch(training){
  SFX.unlock(); MUSIC.start();
  if(state.fs&&!fsActive()) enterFS().catch(function(){});
  state.training=!!training;
  state.score=[0,0]; state.clock=state.training?0:state.minutes*60;
  state.ot=false; state._otEnd=false; state.onTarget=false; state.lastShooter=null;
  if(state.q!==qi){ qi=state.q; applyQuality(); }
  applyMutator();
  buildTeams();
  $('pMode').innerHTML=state.training?'TRAINING':(state.mode+' <b>VS</b> '+state.mode);
  $('pDiff').textContent=state.training?'KEIN GEGNER':DIFF[state.diff].name;

}

  '<div class="rule"></div>'+

    '<div class="t o"><div class="nm">ORANGE</div><div class="sc">'+a+'</div></div>'+
